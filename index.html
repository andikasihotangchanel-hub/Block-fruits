<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota Lengkap 100%</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
    font-family:Arial;
}
canvas{
    display:block;
}

/* Nama Player */
#nameScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    z-index:10;
}
#nameScreen input{
    padding:10px;
    font-size:18px;
    margin:10px;
}
#nameScreen button{
    padding:10px 20px;
    font-size:18px;
}

/* Tombol Jump */
#jumpBtn{
    position:absolute;
    right:30px;
    bottom:80px;
    width:80px;
    height:80px;
    border-radius:50%;
    background:#ff4444;
    color:white;
    font-weight:bold;
    border:none;
    font-size:18px;
    box-shadow:0 4px 8px rgba(0,0,0,0.3);
    z-index:10;
}

/* Joystick (bisa dikembangkan) */
#joystick{
    position:fixed;
    bottom:30px;
    left:30px;
    width:110px;
    height:110px;
    background:rgba(0,0,0,0.3);
    border-radius:50%;
    touch-action:none;
}
#stick{
    position:absolute;
    width:50px;
    height:50px;
    background:white;
    border-radius:50%;
    left:30px;
    top:30px;
}
</style>
</head>
<body>

<!-- INPUT NAMA -->
<div id="nameScreen">
    <h2>Masukkan Nama</h2>
    <input type="text" id="nameInput" placeholder="Nama...">
    <button onclick="startGame()">Mulai</button>
</div>

<canvas id="game"></canvas>
<button id="jumpBtn">JUMP</button>
<div id="joystick"><div id="stick"></div></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// ====================
// Nama Player
// ====================
let playerName="Player";
function startGame(){
    const n=document.getElementById("nameInput").value;
    if(n.trim()!="") playerName=n;
    document.getElementById("nameScreen").style.display="none";
}

// ====================
// PLAYER
// ====================
let player = {
    x:500,
    y:500,
    width:50,
    height:50,
    color:"blue",
    speed:5,
    angle:0
};

let ground = canvas.height - 100;

// Jump
let jumpVelocity=0;
let gravity=0.6;
let isJumping=false;

// Tombol jump
const jumpBtn = document.getElementById("jumpBtn");
jumpBtn.addEventListener("touchstart",()=>{ if(!isJumping){jumpVelocity=-15; isJumping=true;} });
jumpBtn.addEventListener("click",()=>{ if(!isJumping){jumpVelocity=-15; isJumping=true;} });

// ====================
// CAMERA
// ====================
let camera = {x:0,y:0,angle:0};

// ====================
// JOYSTICK
// ====================
let joyX=0, joyY=0, joyActive=false;
let joy = document.getElementById("joystick");
let stick = document.getElementById("stick");

joy.addEventListener("touchstart",()=>joyActive=true);
joy.addEventListener("touchend",()=>{
    joyActive=false; joyX=0; joyY=0;
    stick.style.left="30px"; stick.style.top="30px";
});
joy.addEventListener("touchmove",e=>{
    if(!joyActive) return;
    let r=joy.getBoundingClientRect();
    let t=e.touches[0];
    let x=t.clientX-r.left-55;
    let y=t.clientY-r.top-55;
    let dist=Math.sqrt(x*x+y*y);
    if(dist>45){ x*=45/dist; y*=45/dist; }
    joyX=x/45; joyY=y/45;
    stick.style.left=(30+x)+"px";
    stick.style.top=(30+y)+"px";
});

// ====================
// KEYBOARD
// ====================
let keys={};
window.addEventListener("keydown",e=> keys[e.key.toLowerCase()]=true);
window.addEventListener("keyup",e=> keys[e.key.toLowerCase()]=false);

// ====================
// BANGUNAN KOTA WARNA-WARNI
// ====================
let colors=["#FF5733","#33C1FF","#8D33FF","#33FF57","#FFC300","#FF33A8"];
let buildings=[];
for(let i=0;i<50;i++){
    buildings.push({
        x: Math.random()*2000,
        y: Math.random()*2000,
        width: 60 + Math.random()*40,
        height: 60 + Math.random()*40,
        color: colors[Math.floor(Math.random()*colors.length)]
    });
}

// ====================
// COLLISION
// ====================
function collide(a,b){
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

// ====================
// UPDATE
// ====================
function update(){

    // PC movement
    if(keys["w"]||keys["arrowup"]) player.y -= player.speed;
    if(keys["s"]||keys["arrowdown"]) player.y += player.speed;
    if(keys["a"]||keys["arrowleft"]) player.x -= player.speed;
    if(keys["d"]||keys["arrowright"]) player.x += player.speed;

    // Mobile movement
    player.x += joyX * player.speed;
    player.y += joyY * player.speed;

    // Jump physics
    if(isJumping){
        player.y += jumpVelocity;
        jumpVelocity += gravity;
        if(player.y >= ground - player.height){
            player.y = ground - player.height;
            isJumping=false;
        }
    }

    // Kamera mengikuti player
    camera.x = player.x - canvas.width/2 + player.width/2;
    camera.y = player.y - canvas.height/2 + player.height/2;
}

// ====================
// DRAW
// ====================
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(-camera.x,-camera.y);

    // Jalan
    ctx.fillStyle="gray";
    ctx.fillRect(0,600,3000,200);

    // Bangunan kota
    buildings.forEach(b=>{
        ctx.fillStyle=b.color;
        ctx.fillRect(b.x,b.y,b.width,b.height);
    });

    // Player
    ctx.fillStyle=player.color;
    ctx.fillRect(player.x,player.y,player.width,player.height);

    // Nama di atas kepala
    ctx.fillStyle="black";
    ctx.font="18px Arial";
    ctx.textAlign="center";
    ctx.fillText(playerName,player.x+player.width/2,player.y-10);

    ctx.restore();
}

// ====================
// LOOP GAME
// ====================
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
