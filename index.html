<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Parkour 3 Tahap</title>
<style>
  body { margin:0; overflow:hidden; background:black; }
  canvas { display:block; }

  /* Joystick */
  .joystick {
    position: fixed;
    bottom: 20px;
    left: 20px;
  }

  .circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    margin: 10px;
    display: inline-block;
  }

  /* Tombol lompat */
  .jump {
    position: fixed;
    bottom: 40px;
    right: 40px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: white;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="joystick">
  <div id="left" class="circle"></div>
  <div id="right" class="circle"></div>
</div>

<div id="jump" class="jump"></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Player
let player = {
  x: 50,
  y: 300,
  w: 30,
  h: 30,
  vx: 0,
  vy: 0,
  onGround: false
};

// Stage system
let gravity = 0.5;

// Platform (rintangan hijau)
let platforms = [
  {x: 0, y: 350, w: 300, h: 20},
  {x: 350, y: 300, w: 200, h: 20},

  // Garis stage 1 → 2
  {x: 600, y: 0, w: 10, h: canvas.height},

  // Stage 2
  {x: 650, y: 250, w: 200, h: 20},
  {x: 900, y: 200, w: 200, h: 20},

  // Garis stage 2 → 3
  {x: 1150, y: 0, w: 10, h: canvas.height},

  // Stage 3
  {x: 1200, y: 150, w: 200, h: 20},
  {x: 1500, y: 120, w: 200, h: 20},

  // Finish
  {x: 1800, y: 100, w: 50, h: 50}
];

// Kontrol
let moveLeft = false;
let moveRight = false;

// Joystick event
document.getElementById("left").ontouchstart = () => moveLeft = true;
document.getElementById("left").ontouchend = () => moveLeft = false;

document.getElementById("right").ontouchstart = () => moveRight = true;
document.getElementById("right").ontouchend = () => moveRight = false;

// Lompat
document.getElementById("jump").ontouchstart = () => {
  if (player.onGround) {
    player.vy = -10;
    player.onGround = false;
  }
};

function updateStage() {
  if (player.x > 600 && player.x < 1150) {
    gravity = 0.2; // atmosfer
  } else if (player.x > 1150) {
    gravity = 0; // luar angkasa
  } else {
    gravity = 0.5; // bumi
  }
}

function update() {
  updateStage();

  // Gerak horizontal
  if (moveLeft) player.vx = -3;
  else if (moveRight) player.vx = 3;
  else player.vx = 0;

  // Gravitasi
  player.vy += gravity;

  player.x += player.vx;
  player.y += player.vy;

  player.onGround = false;

  // Collision
  platforms.forEach(p => {
    if (
      player.x < p.x + p.w &&
      player.x + player.w > p.x &&
      player.y < p.y + p.h &&
      player.y + player.h > p.y
    ) {
      // Dari atas
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(-player.x + 100, 0);

  // Player
  ctx.fillStyle = "white";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Platform
  platforms.forEach(p => {
    ctx.fillStyle = "green";
    ctx.fillRect(p.x, p.y, p.w, p.h);
  });

  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
