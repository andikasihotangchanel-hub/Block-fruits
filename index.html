<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Parkour 3 Dunia</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }

.circle {
  width:60px; height:60px;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  position:fixed;
  bottom:20px;
}
#left { left:20px; }
#right { left:100px; }

#jump {
  right:40px;
  bottom:30px;
  position:fixed;
  width:70px; height:70px;
  border-radius:50%;
  background:white;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="left" class="circle"></div>
<div id="right" class="circle"></div>
<div id="jump"></div>

<script>

// DEBUG BIAR GAK PUTIH
window.onerror = function(msg, url, line){
  alert("ERROR: " + msg + " di baris " + line);
}

const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

// ===== BAN SYSTEM =====
let banned = false;
let banEndTime = localStorage.getItem("banTime");

if(banEndTime){
  banEndTime = Number(banEndTime);
  if(Date.now() < banEndTime){
    banned = true;
  } else {
    localStorage.removeItem("banTime");
  }
}

function triggerBan(level = "normal"){

  let min = 0;
  let max = 0;

  if(level == "ringan"){
    min = 5 * 60 * 1000;
    max = 20 * 60 * 1000;
  }
  else if(level == "normal"){
    min = 12 * 60 * 1000;
    max = 2 * 60 * 60 * 1000;
  }
  else if(level == "berat"){
    min = 3 * 60 * 60 * 1000;
    max = 24 * 60 * 60 * 1000;
  }

  let randomTime = Math.floor(Math.random() * (max - min)) + min;

  let banEnd = Date.now() + randomTime;

  localStorage.setItem("banTime", banEnd);

  banned = true;
  banEndTime = banEnd;
}

// ===== PLAYER =====
let p = {x:50,y:300,w:30,h:30,vx:0,vy:0,onGround:false};
let maxHP = 3;
let hp = 3;

// ===== TRACKING =====
let lastX = p.x;
let regenCount = 0;
let lastRegenTime = 0;

// ===== ENEMY =====
let enemy = {x:700,y:200,w:30,h:30,active:false,vy:0,onGround:false};

// ===== REGEN =====
let regen = {x:0,y:0,w:120,h:20,active:false};
let healing = false;
let healStart = 0;

// ===== SYSTEM =====
let enemySpawned = false;
let showText = false;
let textTimer = 0;

const spawn = {x:50,y:300};
let gravity = 0.5;

// ===== PLATFORM =====
let plat = [
  {x:0,y:450,w:800,h:80},
  {x:200,y:380,w:120,h:20},
  {x:350,y:350,w:120,h:20},
  {x:500,y:320,w:120,h:20},
  {x:650,y:300,w:120,h:20},

  {x:800,y:0,w:10,h:600},

  {x:850,y:330,w:120,h:20},
  {x:1000,y:300,w:120,h:20},
  {x:1150,y:270,w:120,h:20},
  {x:1300,y:240,w:120,h:20},

  {x:1500,y:0,w:10,h:600},

  {x:1550,y:300,w:120,h:20},
  {x:1700,y:260,w:120,h:20},
  {x:1850,y:220,w:120,h:20},
  {x:2000,y:180,w:120,h:20},

  {x:2200,y:150,w:150,h:150,finish:true}
];

// ===== CONTROL =====
let left=false,right=false;

document.getElementById("left").ontouchstart=()=>left=true;
document.getElementById("left").ontouchend=()=>left=false;

document.getElementById("right").ontouchstart=()=>right=true;
document.getElementById("right").ontouchend=()=>right=false;

document.getElementById("jump").ontouchstart=()=>{
  if(p.onGround){
    p.vy=-10;
    p.onGround=false;
  }
};

// ===== STAGE =====
function stage(){
  if(p.x < 800){ gravity=0.5; return 1; }
  else if(p.x < 1500){ gravity=0.2; return 2; }
  else{ gravity=0.05; return 3; }
}

// ===== UPDATE =====
function update(){
  if(banned) return;

  let s = stage();

  // ANTI CHEAT
  if(hp>maxHP)
  triggerBan("normal");

  // TEXT MUSUH
  if(showText && Date.now() - textTimer > 8000){
    showText = false;
  }

  // SPAWN REGEN
  if(!regen.active && Math.random() < 0.002){
    regen.active = true;
    regen.x = p.x + 100 + Math.random()*300;
    regen.y = s==1?320:s==2?260:200;
  }

  // GERAK
  p.vx = left?-5:right?5:0;
  p.vy += gravity;
  p.x += p.vx;
  p.y += p.vy;

  // ANTI TELEPORT
  if(Math.abs(p.x - lastX) > 600 && !p.onGround){
  triggerBan("berat");
  }
  lastX = p.x;

  p.onGround=false;

  // PLATFORM
  for(let i of plat){
    if(p.x < i.x+i.w && p.x+p.w > i.x &&
       p.y < i.y+i.h && p.y+p.h > i.y){
      if(p.vy>0){
        p.y=i.y-p.h;
        p.vy=0;
        p.onGround=true;
      }
      if(i.finish){
        alert("FINISH!");
        reset();
      }
    }
  }

  // REGEN COLLISION (CUMA 1)
  if(regen.active){
    if(p.x < regen.x+regen.w && p.x+p.w > regen.x &&
       p.y < regen.y+regen.h && p.y+p.h > regen.y){
      if(p.y + p.h <= regen.y + 10){
        p.y = regen.y - p.h;
        p.vy = 0;
        p.onGround = true;

        if(hp < maxHP && !healing){
          healing = true;
          healStart = Date.now();
        }
      }
    }
  }

  // HEAL
  if(healing && Date.now() - healStart > 1000){
    if(Date.now() - lastRegenTime < 2000){
      regenCount++;
    } else {
      regenCount = 1;
    }

    if(regenCount > 5) triggerBan("normal");

    lastRegenTime = Date.now();
    hp = maxHP;
    healing = false;
    regen.active = false;
  }

  // SPAWN MUSUH
  if(s==2 && !enemySpawned){
    enemy.active=true;
    enemySpawned=true;
    showText=true;
    textTimer=Date.now();
  }

  // AI MUSUH
  if(enemy.active){
    let dx = p.x - enemy.x;
    let speed = Math.abs(dx) < 200 ? 3 : 2;

    if(Math.abs(dx) > 5){
      enemy.x += dx>0 ? speed : -speed;
    }

    enemy.vy += 0.5;
    enemy.y += enemy.vy;

    enemy.onGround=false;
    for(let i of plat){
      if(enemy.x < i.x+i.w && enemy.x+enemy.w > i.x &&
         enemy.y < i.y+i.h && enemy.y+enemy.h > i.y){
        if(enemy.vy>0){
          enemy.y=i.y-enemy.h;
          enemy.vy=0;
          enemy.onGround=true;
        }
      }
    }
  }

  // KENA MUSUH
  if(enemy.active){
    if(p.x < enemy.x+enemy.w && p.x+p.w > enemy.x &&
       p.y < enemy.y+enemy.h && p.y+p.h > enemy.y){
      hp--;
      reset();
      if(hp<=0){
        alert("GAME OVER");
        location.reload();
      }
    }
  }

  if(p.y > c.height) reset();
}

function reset(){
  p.x=spawn.x;
  p.y=spawn.y;
  p.vy=0;
}

// ===== DRAW =====
function draw(){

  if(banned){
    ctx.fillStyle="black";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle="red";
    ctx.font="bold 50px Arial";
    ctx.textAlign="center";
    ctx.fillText("BANED", c.width/2,150);

    let sisa = banEndTime - Date.now();
    let jam = Math.floor(sisa/3600000);
    let menit = Math.floor((sisa%3600000)/60000);
    let detik = Math.floor((sisa%60000)/1000);

    ctx.fillStyle="white";
    ctx.font="20px Arial";
    ctx.fillText("reset dalam: "+jam+":"+menit+":"+detik, c.width/2,250);
    return;
  }

  let s = stage();
  ctx.fillStyle = s==1?"skyblue":s==2?"#400000":"black";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.save();
  ctx.translate(-p.x+100,0);

  for(let i of plat){
    ctx.fillStyle = i.finish?"yellow":i.w==10?"lime":"green";
    ctx.fillRect(i.x,i.y,i.w,i.h);
  }

  if(regen.active){
    ctx.fillStyle="#00FFFF";
    ctx.fillRect(regen.x,regen.y,regen.w,regen.h);
  }

  if(enemy.active){
    ctx.fillStyle="red";
    ctx.fillRect(enemy.x,enemy.y,enemy.w,enemy.h);
  }

  // TEXT MUSUH
  if(showText){
    ctx.fillStyle="white";
    ctx.font="16px Arial";
    ctx.fillText("Musuh pertama! Lewati dia!", p.x-100,50);
  }

  ctx.fillStyle="white";
  ctx.fillRect(p.x,p.y,p.w,p.h);

  ctx.restore();

  for(let i=0;i<maxHP;i++){
    ctx.strokeStyle="white";
    ctx.strokeRect(c.width-50-(i*35),20,25,25);
    ctx.fillStyle = i<hp?"blue":"black";
    ctx.fillRect(c.width-50-(i*35),20,25,25);
  }

  ctx.fillStyle="white";
  ctx.fillText("HP:"+hp,20,30);
}

// ===== LOOP =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
