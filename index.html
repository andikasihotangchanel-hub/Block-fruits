<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Blocks v1.0</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:sans-serif;
}

#joystick{
position:fixed;
left:30px;
bottom:30px;
width:90px;
height:90px;
background:rgba(255,255,255,0.2);
border-radius:50%;
}

#stick{
position:absolute;
left:25px;
top:25px;
width:40px;
height:40px;
background:white;
border-radius:50%;
}

#jump{
position:fixed;
right:30px;
bottom:30px;
width:80px;
height:80px;
background:red;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

</style>
</head>

<body>

<div id="joystick"><div id="stick"></div></div>
<div id="jump">JUMP</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

let scene = new THREE.Scene()

let camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
10000
)

let renderer = new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

let light = new THREE.DirectionalLight(0xffffff,1)
light.position.set(10,50,20)
scene.add(light)

let ambient = new THREE.AmbientLight(0xffffff,0.6)
scene.add(ambient)

let groundGeo = new THREE.PlaneGeometry(2000,2000)
let groundMat = new THREE.MeshStandardMaterial({color:0x444444})
let ground = new THREE.Mesh(groundGeo,groundMat)
ground.rotation.x = -Math.PI/2
scene.add(ground)

let texture = new THREE.TextureLoader().load(
"https://threejs.org/examples/textures/brick_diffuse.jpg"
)

function createCity(){

for(let i=0;i<200;i++){

let w = 20 + Math.random()*40
let h = 40 + Math.random()*200
let d = 20 + Math.random()*40

let geo = new THREE.BoxGeometry(w,h,d)

let mat = new THREE.MeshStandardMaterial({
map:texture
})

let building = new THREE.Mesh(geo,mat)

building.position.x = (Math.random()-0.5)*1000
building.position.z = (Math.random()-0.5)*1000
building.position.y = h/2

scene.add(building)

}

}

createCity()

/* CLOUDS */

let clouds=[]

function createClouds(){

for(let i=0;i<20;i++){

let geo = new THREE.SphereGeometry(20,16,16)
let mat = new THREE.MeshStandardMaterial({color:0xffffff})

let cloud = new THREE.Mesh(geo,mat)

cloud.position.x = (Math.random()-0.5)*1500
cloud.position.z = (Math.random()-0.5)*1500
cloud.position.y = 200 + Math.random()*100

scene.add(cloud)
clouds.push(cloud)

}

}

createClouds()

/* NPC */

let npcs=[]

function createNPC(){

for(let i=0;i<15;i++){

let geo = new THREE.CapsuleGeometry(0.5,1.5,4,8)
let mat = new THREE.MeshStandardMaterial({color:0x00ff00})

let npc = new THREE.Mesh(geo,mat)

npc.position.x=(Math.random()-0.5)*800
npc.position.z=(Math.random()-0.5)*800
npc.position.y=1

npc.dir = Math.random()*Math.PI*2

scene.add(npc)
npcs.push(npc)

}

}

createNPC()

/* CARS */

let cars=[]

function createCars(){

for(let i=0;i<8;i++){

let geo = new THREE.BoxGeometry(3,1.5,6)
let mat = new THREE.MeshStandardMaterial({color:0xff0000})

let car = new THREE.Mesh(geo,mat)

car.position.x=-500
car.position.z=i*40-200
car.position.y=1

scene.add(car)
cars.push(car)

}

}

createCars()

/* PLAYER */

let player = {
x:0,
y:2,
z:0,
vy:0,
speed:0.2
}

camera.position.set(0,2,5)

/* JOYSTICK */

let moveX=0
let moveZ=0

let joystick = document.getElementById("joystick")
let stick = document.getElementById("stick")

joystick.addEventListener("touchmove",e=>{

let rect = joystick.getBoundingClientRect()

let x = e.touches[0].clientX - rect.left - 45
let y = e.touches[0].clientY - rect.top - 45

x=Math.max(-30,Math.min(30,x))
y=Math.max(-30,Math.min(30,y))

stick.style.left = (25+x)+"px"
stick.style.top = (25+y)+"px"

moveX = x/30
moveZ = y/30

})

joystick.addEventListener("touchend",e=>{
moveX=0
moveZ=0
stick.style.left="25px"
stick.style.top="25px"
})

/* JUMP */

let jumpBtn = document.getElementById("jump")

jumpBtn.addEventListener("touchstart",()=>{
if(player.y<=2.01){
player.vy=0.35
}
})

/* CAMERA TOUCH */

let rotX=0
let rotY=0

let lastX=0
let lastY=0

document.addEventListener("touchstart",e=>{
lastX = e.touches[0].clientX
lastY = e.touches[0].clientY
})

document.addEventListener("touchmove",e=>{

let x = e.touches[0].clientX
let y = e.touches[0].clientY

let dx = x - lastX
let dy = y - lastY

lastX = x
lastY = y

rotY -= dx * 0.005
rotX -= dy * 0.005

rotX = Math.max(-1.5, Math.min(1.5, rotX))

})

/* DAY NIGHT */

let time=0

function animate(){

requestAnimationFrame(animate)

/* gravity */

player.vy -= 0.02
player.y += player.vy

if(player.y<2){
player.y=2
player.vy=0
}

/* movement */

player.x -= Math.sin(rotY)*moveZ*player.speed
player.z -= Math.cos(rotY)*moveZ*player.speed

player.x += Math.cos(rotY)*moveX*player.speed
player.z -= Math.sin(rotY)*moveX*player.speed

/* map limit */

player.x = Math.max(-900,Math.min(900,player.x))
player.z = Math.max(-900,Math.min(900,player.z))

camera.position.set(player.x,player.y,player.z)

camera.rotation.order="YXZ"
camera.rotation.y=rotY
camera.rotation.x=rotX

/* clouds */

for(let c of clouds){

c.position.x += 0.05

if(c.position.x>800){
c.position.x=-800
}

}

/* NPC */

for(let npc of npcs){

npc.position.x += Math.sin(npc.dir)*0.05
npc.position.z += Math.cos(npc.dir)*0.05

if(Math.random()<0.01){
npc.dir += (Math.random()-0.5)
}

}

/* cars */

for(let car of cars){

car.position.x += 0.5

if(car.position.x>500){
car.position.x=-500
}

}

/* day night */

time += 0.001

let sun = Math.sin(time)

scene.background = new THREE.Color().setHSL(0.6,0.6,0.5 + sun*0.2)

light.position.x = Math.cos(time)*200
light.position.y = Math.sin(time)*200

renderer.render(scene,camera)

}

animate()

</script>

</body>
</html>
