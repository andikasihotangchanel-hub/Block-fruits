<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota Bebas Kamera + Lompat</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #87CEEB;
    font-family: Arial, sans-serif;
}
canvas { display: block; }

/* Layar Nama */
#nameScreen{
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    z-index: 10;
}
#nameScreen input{
    padding: 10px;
    font-size: 18px;
    margin: 10px;
}
#nameScreen button{
    padding: 10px 20px;
    font-size: 18px;
}

/* Joystick */
#joystick{
    position: fixed;
    bottom: 30px;
    left: 30px;
    width: 110px;
    height: 110px;
    background: rgba(0,0,0,0.3);
    border-radius: 50%;
    touch-action: none;
}
#stick{
    position: absolute;
    width: 50px;
    height: 50px;
    background: white;
    border-radius: 50%;
    left: 30px;
    top: 30px;
}

/* Tombol Jump */
#jumpBtn{
    position: fixed;
    right: 30px;
    bottom: 80px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #ff4444;
    color: white;
    font-weight: bold;
    border: none;
    font-size: 18px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<!-- Nama Player -->
<div id="nameScreen">
    <h2>Masukkan Nama</h2>
    <input type="text" id="nameInput" placeholder="Nama...">
    <button onclick="startGame()">Mulai</button>
</div>

<!-- Joystick -->
<div id="joystick"><div id="stick"></div></div>

<!-- Canvas -->
<canvas id="game"></canvas>

<!-- Tombol Lompat -->
<button id="jumpBtn">JUMP</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* Nama player */
let playerName = "Player";
function startGame(){
    let n = document.getElementById("nameInput").value;
    if(n.trim() != "") playerName = n;
    document.getElementById("nameScreen").style.display = "none";
}

/* PLAYER */
let player = {
    x: 0,
    y: 0,
    width: 30,
    height: 50,
    head: 20,
    speed: 4,
    angle: 0,
    jumpVelocity: 0,
    isJumping: false
};

/* CAMERA */
let camera = {
    x: 0,
    y: 0,
    angle: 0
};

/* JOYSTICK */
let joyX=0, joyY=0, active=false;
let joy=document.getElementById("joystick");
let stick=document.getElementById("stick");

joy.addEventListener("touchstart",()=>active=true);
joy.addEventListener("touchend",()=>{
    active=false;
    joyX=0; joyY=0;
    stick.style.left="30px";
    stick.style.top="30px";
});
joy.addEventListener("touchmove", e=>{
    if(!active) return;
    let r = joy.getBoundingClientRect();
    let t = e.touches[0];
    let x = t.clientX - r.left - 55;
    let y = t.clientY - r.top - 55;
    let d = Math.sqrt(x*x + y*y);
    if(d>45){x*=45/d;y*=45/d;}
    joyX = x/45;
    joyY = y/45;
    stick.style.left=(30+x)+"px";
    stick.style.top=(30+y)+"px";
});

/* Tombol Jump */
const jumpBtn = document.getElementById("jumpBtn");
jumpBtn.addEventListener("touchstart", jump);
jumpBtn.addEventListener("mousedown", jump);
function jump(){
    if(!player.isJumping){
        player.jumpVelocity = -12;
        player.isJumping = true;
    }
}

/* Bangunan (lebih realistis 2D) */
let colors = ["#8B4513","#A0522D","#CD853F","#D2691E","#F4A460"];
let buildings = [];
for(let i=0;i<50;i++){
    buildings.push({
        x: Math.random()*2000-1000,
        y: Math.random()*2000-1000,
        width: 50 + Math.random()*40,
        height: 50 + Math.random()*100,
        color: colors[Math.floor(Math.random()*colors.length)]
    });
}

/* Keyboard */
let keys = {};
window.addEventListener("keydown", e=>keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e=>keys[e.key.toLowerCase()] = false);

/* UPDATE */
function update(){
    // Keyboard movement
    let moveX=0, moveY=0;
    if(keys["w"]||keys["arrowup"]) moveY=-1;
    if(keys["s"]||keys["arrowdown"]) moveY=1;
    if(keys["a"]||keys["arrowleft"]) moveX=-1;
    if(keys["d"]||keys["arrowright"]) moveX=1;

    // Mobile joystick
    moveX += joyX;
    moveY += joyY;

    // Update player pos
    player.x += moveX * player.speed;
    player.y += moveY * player.speed;

    // Lompat physics
    if(player.isJumping){
        player.y += player.jumpVelocity;
        player.jumpVelocity += 0.6; // gravity
        if(player.y >= 0){ // lantai default di y=0
            player.y = 0;
            player.isJumping = false;
            player.jumpVelocity = 0;
        }
    }

    // Kamera mengikuti player
    camera.x = player.x - canvas.width/2;
    camera.y = player.y - canvas.height/2;
}

/* DRAW */
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // background
    ctx.fillStyle="#87CEEB";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // jalan / ground
    ctx.fillStyle="#228B22";
    ctx.fillRect(-2000,0,4000,canvas.height); // luas area ground

    // bangunan
    buildings.forEach(b=>{
        ctx.fillStyle=b.color;
        ctx.fillRect(b.x,b.y-b.height,b.width,b.height);
        // pintu / detail
        ctx.fillStyle="#333";
        ctx.fillRect(b.x+b.width/4,b.y-b.height/2,b.width/2,b.height/2);
    });

    // player
    let px = player.x;
    let py = player.y;

    // kaki
    ctx.fillStyle="black";
    ctx.fillRect(px-10, py, 8, 20);
    ctx.fillRect(px+2, py, 8, 20);

    // badan
    ctx.fillStyle="blue";
    ctx.fillRect(px-15, py-10, 30, 25);

    // kepala
    ctx.fillStyle="yellow";
    ctx.fillRect(px-12, py-30, 24, 20);

    // tangan
    ctx.fillStyle="black";
    ctx.fillRect(px-20, py-10, 5, 20);
    ctx.fillRect(px+15, py-10, 5, 20);

    // nama
    ctx.fillStyle="black";
    ctx.textAlign="center";
    ctx.fillText(playerName, px, py-40);

    ctx.restore();
}

/* LOOP */
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
