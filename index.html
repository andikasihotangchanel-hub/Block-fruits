<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: skyblue;
}
canvas { display: block; }

/* Layar Nama */
#nameScreen{
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    z-index: 10;
}
#nameScreen input{
    padding: 10px;
    font-size: 18px;
    margin: 10px;
}
#nameScreen button{
    padding: 10px 20px;
    font-size: 18px;
}

/* Joystick */
#joystick{
    position: fixed;
    bottom: 30px;
    left: 30px;
    width: 100px;
    height: 100px;
    background: rgba(0,0,0,0.3);
    border-radius: 50%;
    touch-action: none;
}
#stick{
    position: absolute;
    width: 50px;
    height: 50px;
    background: white;
    border-radius: 50%;
    left: 25px;
    top: 25px;
}
</style>
</head>

<body>

<!-- INPUT NAMA -->
<div id="nameScreen">
    <h2>Masukkan Nama</h2>
    <input type="text" id="nameInput" placeholder="Nama...">
    <button onclick="startGame()">Mulai</button>
</div>

<!-- JOYSTICK -->
<div id="joystick">
    <div id="stick"></div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let camera = {x:0,y:0};
let playerName = "Player";

function startGame(){
    const input = document.getElementById("nameInput").value;
    if(input.trim() !== ""){
        playerName = input;
    }
    document.getElementById("nameScreen").style.display = "none";
}

// PLAYER
let player = {
    x: 500,
    y: 500,
    width: 60,
    height: 80,
    speed: 4
};

let insideHouse = false;

// PLAYER IMAGE
const playerImage = new Image();
playerImage.src = "player.png";

// =======================
// KOTA (BANYAK BANGUNAN)
// =======================
let buildings = [];
for(let i=0;i<20;i++){
    buildings.push({
        x: Math.random()*2000,
        y: Math.random()*2000,
        width: 120,
        height: 120
    });
}

// =======================
// RUMAH BISA MASUK
// =======================
let houses = [
    { x: 800, y: 500, width: 150, height: 150 },
    { x: 1200, y: 900, width: 150, height: 150 }
];

// =======================
// KEYBOARD (PC SUPPORT)
// =======================
let keys = {};
window.addEventListener("keydown", e=> keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e=> keys[e.key.toLowerCase()] = false);

// =======================
// JOYSTICK MOBILE
// =======================
let joystick = document.getElementById("joystick");
let stick = document.getElementById("stick");
let joyActive = false;
let joyX=0, joyY=0;

joystick.addEventListener("touchstart", ()=> joyActive = true);
joystick.addEventListener("touchend", ()=>{
    joyActive = false;
    joyX=0; joyY=0;
    stick.style.left="25px";
    stick.style.top="25px";
});
joystick.addEventListener("touchmove", e=>{
    if(!joyActive) return;
    let rect = joystick.getBoundingClientRect();
    let touch = e.touches[0];
    let x = touch.clientX - rect.left - 50;
    let y = touch.clientY - rect.top - 50;
    let dist = Math.sqrt(x*x+y*y);
    if(dist>40){ x*=40/dist; y*=40/dist; }
    joyX = x/40;
    joyY = y/40;
    stick.style.left=(25+x)+"px";
    stick.style.top=(25+y)+"px";
});

// =======================
// COLLISION
// =======================
function collide(a,b){
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

// =======================
// UPDATE
// =======================
function update(){

    // PC movement
    if(keys["w"]||keys["arrowup"]) player.y -= player.speed;
    if(keys["s"]||keys["arrowdown"]) player.y += player.speed;
    if(keys["a"]||keys["arrowleft"]) player.x -= player.speed;
    if(keys["d"]||keys["arrowright"]) player.x += player.speed;

    // Mobile movement
    player.x += joyX * player.speed;
    player.y += joyY * player.speed;

    // Kamera follow bebas
    camera.x = player.x - canvas.width/2 + player.width/2;
    camera.y = player.y - canvas.height/2 + player.height/2;

    // Masuk rumah otomatis
    insideHouse = false;
    houses.forEach(h=>{
        if(collide(player,h)){
            insideHouse = true;
        }
    });
}

// =======================
// DRAW
// =======================
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(-camera.x,-camera.y);

    // Jalan
    ctx.fillStyle="gray";
    ctx.fillRect(0,600,3000,200);

    // Bangunan kota
    ctx.fillStyle="darkgray";
    buildings.forEach(b=>{
        ctx.fillRect(b.x,b.y,b.width,b.height);
    });

    // Rumah
    ctx.fillStyle="brown";
    houses.forEach(h=>{
        ctx.fillRect(h.x,h.y,h.width,h.height);
    });

    // Player
    if(playerImage.complete){
        ctx.drawImage(playerImage,player.x,player.y,player.width,player.height);
    }

    // Nama di atas kepala
    ctx.fillStyle="black";
    ctx.font="18px Arial";
    ctx.textAlign="center";
    ctx.fillText(playerName,player.x+player.width/2,player.y-10);

    ctx.restore();

    // Interior
    if(insideHouse){
        ctx.fillStyle="white";
        ctx.fillRect(100,100,canvas.width-200,canvas.height-200);
        ctx.fillStyle="black";
        ctx.font="20px Arial";
        ctx.fillText("Di Dalam Rumah",150,150);
    }
}

// =======================
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
