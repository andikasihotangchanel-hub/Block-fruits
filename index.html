<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Parkour 4 Dunia</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }

.circle {
  width:60px; height:60px;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  position:fixed;
  bottom:20px;
}
#left { left:20px; }
#right { left:100px; }

#jump {
  right:40px;
  bottom:30px;
  position:fixed;
  width:70px; height:70px;
  border-radius:50%;
  background:white;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="left" class="circle"></div>
<div id="right" class="circle"></div>
<div id="jump"></div>

<script>

// ===== CANVAS =====
const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

// ===== BAN SYSTEM =====
let banned = false;
let banEndTime = Number(localStorage.getItem("banTime"));

if(banEndTime && Date.now() < banEndTime){
  banned = true;
}else{
  localStorage.removeItem("banTime");
}

function triggerBan(level="normal"){
  let min=0, max=0;

  if(level=="ringan"){ min=2*60*1000; max=10*60*1000; }
  else if(level=="normal"){ min=10*60*1000; max=2*60*60*1000; }
  else { min=2*60*60*1000; max=24*60*60*1000; }

  let random = Math.random()*(max-min)+min;
  banEndTime = Date.now()+random;

  localStorage.setItem("banTime", banEndTime);
  banned = true;
}

// ===== PLAYER =====
let p = {x:50,y:300,w:30,h:30,vx:0,vy:0,onGround:false};
let spawn = {x:50,y:450};
let gravity = 0.5;

// ===== HP =====
let maxHP = 3;
let hp = 3;

// ===== SAFE TIME (ANTI BAN SALAH) =====
let safeTime = 0;

// ===== TRACK =====
let lastX = p.x;
let regenCount = 0;
let lastRegenTime = 0;

// ===== ENEMY =====
let enemy = {x:700,y:200,w:30,h:30,active:false,vy:0};

// ===== REGEN =====
let regen = {x:0,y:0,w:120,h:20,active:false};
let healing = false;
let healStart = 0;

// ===== MODE =====
let mode = "normal";

// ===== PLATFORM =====
let plat = [];

function generatePlatform(){
  plat = [];

  // lantai awal
  plat.push({x:0,y:450,w:800,h:80});

  let jumlah = mode=="mudah"?10:mode=="normal"?15:25;

  for(let i=0;i<jumlah;i++){
    let x = 200 + Math.random()*2000;
    let y = 150 + Math.random()*300;

    plat.push({
      x:x,
      y:y,
      w:100,
      h:20
    });
  }

  // pembatas dunia
  plat.push({x:800,y:0,w:10,h:600});
  plat.push({x:1500,y:0,w:10,h:600});
  plat.push({x:2200,y:0,w:10,h:600});

  // finish
  plat.push({x:2600,y:200,w:150,h:150,finish:true});
}

generatePlatform();

// ===== CONTROL =====
let left=false,right=false;

leftBtn = document.getElementById("left");
rightBtn = document.getElementById("right");
jumpBtn = document.getElementById("jump");

leftBtn.ontouchstart=()=>left=true;
leftBtn.ontouchend=()=>left=false;

rightBtn.ontouchstart=()=>right=true;
rightBtn.ontouchend=()=>right=false;

jumpBtn.ontouchstart=()=>{
  if(p.onGround){
    p.vy=-10;
    p.onGround=false;
  }
};

// ===== STAGE =====
function stage(){
  if(p.x < 800){ gravity=0.5; return 1; }
  else if(p.x < 1500){ gravity=0.2; return 2; }
  else if(p.x < 2200){ gravity=0.08; return 3; }
  else{ gravity=0.03; return 4; }
}

// ===== UPDATE =====
function update(){

  if(banned) return;

  let s = stage();

  // gerak
  p.vx = left?-5:right?5:0;
  p.vy += gravity;
  p.x += p.vx;
  p.y += p.vy;

  // anti teleport (AMAN)
  if(Date.now() - safeTime > 1000){
    if(Math.abs(p.x - lastX) > 1000 && !p.onGround){
      triggerBan("berat");
    }
  }
  lastX = p.x;

  p.onGround = false;

  // ===== COLLISION PLATFORM =====
  for(let i of plat){
    if(
      p.x < i.x+i.w &&
      p.x+p.w > i.x &&
      p.y < i.y+i.h &&
      p.y+p.h > i.y
    ){
      if(p.vy > 0){
        p.y = i.y - p.h;
        p.vy = 0;
        p.onGround = true;
      }

      if(i.finish){
        alert("FINISH!");
        location.reload();
      }
    }
  }

  // ===== SPAWN REGEN =====
  if(!regen.active && Math.random()<0.002){
    regen.active=true;
    regen.x=p.x+100+Math.random()*200;
    regen.y=200;
  }

  // ===== REGEN COLLISION =====
  if(regen.active){
    if(
      p.x < regen.x+regen.w &&
      p.x+p.w > regen.x &&
      p.y < regen.y+regen.h &&
      p.y+p.h > regen.y
    ){
      if(p.y + p.h <= regen.y + 10){
        p.y = regen.y - p.h;
        p.vy = 0;
        p.onGround = true;

        if(hp < maxHP && !healing){
          healing = true;
          healStart = Date.now();
        }
      }
    }
  }

  // ===== HEAL =====
  if(healing && Date.now()-healStart > 1000){
    if(Date.now()-lastRegenTime < 2000) regenCount++;
    else regenCount = 1;

    if(regenCount > 5) triggerBan("normal");

    lastRegenTime = Date.now();
    hp = maxHP;
    healing = false;
    regen.active = false;
  }

  // ===== ENEMY =====
  if(s==2){
    enemy.active=true;
  }

  if(enemy.active){
    let dx = p.x - enemy.x;

    if(Math.abs(dx)>5){
      enemy.x += dx>0?2:-2;
    }

    enemy.vy += 0.5;
    enemy.y += enemy.vy;

    for(let i of plat){
      if(
        enemy.x < i.x+i.w &&
        enemy.x+enemy.w > i.x &&
        enemy.y < i.y+i.h &&
        enemy.y+enemy.h > i.y
      ){
        if(enemy.vy>0){
          enemy.y=i.y-enemy.h;
          enemy.vy=0;
        }
      }
    }
  }

  // ===== KENA MUSUH =====
  if(enemy.active){
    if(
      p.x < enemy.x+enemy.w &&
      p.x+p.w > enemy.x &&
      p.y < enemy.y+enemy.h &&
      p.y+p.h > enemy.y
    ){
      hp--;
      safeTime = Date.now();
      reset();

      if(hp<=0){
        alert("GAME OVER");
        location.reload();
      }
    }
  }

  if(p.y > c.height) reset();
}

// ===== RESET =====
function reset(){
  p.x=spawn.x;
  p.y=spawn.y;
  p.vy=0;
}

// ===== DRAW =====
function draw(){

  if(banned){
    ctx.fillStyle="black";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle="red";
    ctx.font="bold 40px Arial";
    ctx.textAlign="center";
    ctx.fillText("BANNED", c.width/2,150);

    let sisa = banEndTime - Date.now();
    let jam = Math.floor(sisa/3600000);
    let menit = Math.floor((sisa%3600000)/60000);
    let detik = Math.floor((sisa%60000)/1000);

    ctx.fillStyle="white";
    ctx.fillText(jam+":"+menit+":"+detik, c.width/2,250);
    return;
  }

  let s = stage();

  // background
  if(s==1) ctx.fillStyle="skyblue";
  else if(s==2) ctx.fillStyle="#400000";
  else if(s==3) ctx.fillStyle="black";
  else{
    let g = ctx.createLinearGradient(0,0,c.width,c.height);
    g.addColorStop(0,"black");
    g.addColorStop(0.5,"pink");
    g.addColorStop(1,"white");
    ctx.fillStyle=g;
  }

  ctx.fillRect(0,0,c.width,c.height);

  ctx.save();
  ctx.translate(-p.x+100,0);

  // platform
  for(let i of plat){
    ctx.fillStyle = i.finish?"yellow":i.w==10?"lime":"green";
    ctx.fillRect(i.x,i.y,i.w,i.h);
  }

  // regen
  if(regen.active){
    ctx.fillStyle="#00FFFF";
    ctx.fillRect(regen.x,regen.y,regen.w,regen.h);
  }

  // enemy
  if(enemy.active){
    ctx.fillStyle="red";
    ctx.fillRect(enemy.x,enemy.y,enemy.w,enemy.h);
  }

  // player
  ctx.fillStyle="white";
  ctx.fillRect(p.x,p.y,p.w,p.h);

  ctx.restore();

  // HP UI
  for(let i=0;i<maxHP;i++){
    ctx.strokeStyle="white";
    ctx.strokeRect(c.width-50-(i*35),20,25,25);
    ctx.fillStyle = i<hp?"blue":"black";
    ctx.fillRect(c.width-50-(i*35),20,25,25);
  }
}

// ===== LOOP =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
