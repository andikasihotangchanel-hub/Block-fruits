<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Blocks v0.4</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:sans-serif;
}

#joystick{
position:fixed;
left:30px;
bottom:30px;
width:90px;
height:90px;
background:rgba(255,255,255,0.2);
border-radius:50%;
}

#stick{
position:absolute;
left:25px;
top:25px;
width:40px;
height:40px;
background:white;
border-radius:50%;
}

#jump{
position:fixed;
right:30px;
bottom:30px;
width:80px;
height:80px;
background:red;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

</style>
</head>

<body>

<div id="joystick"><div id="stick"></div></div>
<div id="jump">JUMP</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

let scene = new THREE.Scene()
scene.background = new THREE.Color(0x87ceeb)

let camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
10000
)

let renderer = new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

let light = new THREE.DirectionalLight(0xffffff,1)
light.position.set(10,50,20)
scene.add(light)

let ambient = new THREE.AmbientLight(0xffffff,0.6)
scene.add(ambient)

let groundGeo = new THREE.PlaneGeometry(2000,2000)
let groundMat = new THREE.MeshStandardMaterial({color:0x444444})
let ground = new THREE.Mesh(groundGeo,groundMat)
ground.rotation.x = -Math.PI/2
scene.add(ground)

function createCity(){

for(let i=0;i<200;i++){

let w = 20 + Math.random()*40
let h = 40 + Math.random()*200
let d = 20 + Math.random()*40

let geo = new THREE.BoxGeometry(w,h,d)

let mat = new THREE.MeshStandardMaterial({
color:0x888888
})

let building = new THREE.Mesh(geo,mat)

building.position.x = (Math.random()-0.5)*1000
building.position.z = (Math.random()-0.5)*1000
building.position.y = h/2

scene.add(building)

}

}

createCity()

let player = {
x:0,
y:2,
z:0,
vy:0,
speed:0.2
}

camera.position.set(0,2,5)

let moveX=0
let moveZ=0

let joystick = document.getElementById("joystick")
let stick = document.getElementById("stick")

let joyActive=false

joystick.addEventListener("touchstart",e=>{
joyActive=true
})

joystick.addEventListener("touchmove",e=>{

let rect = joystick.getBoundingClientRect()

let x = e.touches[0].clientX - rect.left - 45
let y = e.touches[0].clientY - rect.top - 45

x=Math.max(-30,Math.min(30,x))
y=Math.max(-30,Math.min(30,y))

stick.style.left = (25+x)+"px"
stick.style.top = (25+y)+"px"

moveX = x/30
moveZ = y/30

})

joystick.addEventListener("touchend",e=>{
joyActive=false
moveX=0
moveZ=0
stick.style.left="25px"
stick.style.top="25px"
})

let jumpBtn = document.getElementById("jump")

jumpBtn.addEventListener("touchstart",()=>{
if(player.y<=2.01){
player.vy=0.35
}
})

let rotX=0
let rotY=0

document.addEventListener("touchmove",e=>{

if(e.touches.length==1){

rotY += e.touches[0].movementX*0.002
rotX += e.touches[0].movementY*0.002

}

})

function animate(){

requestAnimationFrame(animate)

player.vy -= 0.02
player.y += player.vy

if(player.y<2){
player.y=2
player.vy=0
}

player.x -= Math.sin(rotY)*moveZ*player.speed
player.z -= Math.cos(rotY)*moveZ*player.speed

player.x += Math.cos(rotY)*moveX*player.speed
player.z -= Math.sin(rotY)*moveX*player.speed

camera.position.set(player.x,player.y,player.z)

camera.rotation.order="YXZ"
camera.rotation.y=rotY
camera.rotation.x=rotX

renderer.render(scene,camera)

}

animate()

</script>
</body>
</html>
