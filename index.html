<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HAPPY UPDATE</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { touch-action:none; }
#joystick{
position:fixed;
bottom:40px;
left:40px;
width:120px;
height:120px;
background:rgba(255,255,255,0.1);
border-radius:50%;
}
#stick{
position:absolute;
width:60px;
height:60px;
background:white;
border-radius:50%;
top:30px;
left:30px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<audio id="bgMusic" loop>
<source src="ultah.mp3" type="audio/mpeg">
</audio>

<div id="joystick"><div id="stick"></div></div>

<script>
// ===== EVENT BULAN MARET =====
if(new Date().getMonth()!==2){
alert("Event hanya bulan Maret 🎂");
}

// ===== CANVAS =====
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

// ===== MUSIC =====
let musicStarted=false;
const bgMusic=document.getElementById("bgMusic");
document.addEventListener("touchstart",()=>{
if(!musicStarted){
bgMusic.play().catch(()=>{});
musicStarted=true;
}
});

// ===== PLAYER =====
let player={
x:0,
y:0,
z:0,
vy:0
};

// ===== CAMERA =====
let camera={
x:0,
y:80,
z:200,
offsetY:80,
rotX:0,
rotY:0
};

let lastTouchX=0;
let lastTouchY=0;
let cameraControl=false;

// Kamera geser bebas (area selain joystick)
canvas.addEventListener("touchstart",e=>{
if(e.target.id!=="stick"){
cameraControl=true;
lastTouchX=e.touches[0].clientX;
lastTouchY=e.touches[0].clientY;
}
});

canvas.addEventListener("touchmove",e=>{
if(cameraControl){
let touch=e.touches[0];
let dx=touch.clientX-lastTouchX;
let dy=touch.clientY-lastTouchY;

camera.rotY+=dx*0.005;
camera.rotX+=dy*0.005;

camera.rotX=Math.max(-1,Math.min(1,camera.rotX));

lastTouchX=touch.clientX;
lastTouchY=touch.clientY;
}
});

canvas.addEventListener("touchend",()=>{
cameraControl=false;
});

// ===== JOYSTICK =====
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joyX=0,joyY=0,joyActive=false;

joystick.addEventListener("touchstart",()=>{joyActive=true;});

joystick.addEventListener("touchmove",e=>{
let rect=joystick.getBoundingClientRect();
let t=e.touches[0];
joyX=t.clientX-(rect.left+60);
joyY=t.clientY-(rect.top+60);
let d=Math.sqrt(joyX*joyX+joyY*joyY);
if(d>40){ joyX*=40/d; joyY*=40/d; }
stick.style.left=(joyX+30)+"px";
stick.style.top=(joyY+30)+"px";
});

joystick.addEventListener("touchend",()=>{
joyActive=false; joyX=0; joyY=0;
stick.style.left="30px";
stick.style.top="30px";
});

// ===== JUMP =====
document.addEventListener("touchstart",e=>{
if(e.target.id!=="stick"){
if(player.y===0) player.vy=8;
}
});

// ===== UPDATE =====
function update(){

// player move
if(joyActive){
player.x+=Math.sin(camera.rotY)*(-joyY*0.1);
player.z+=Math.cos(camera.rotY)*(-joyY*0.1);
player.x+=Math.cos(camera.rotY)*(joyX*0.1);
player.z-=Math.sin(camera.rotY)*(joyX*0.1);
}

// gravity
player.vy-=0.4;
player.y+=player.vy;
if(player.y<0){player.y=0;player.vy=0;}

// camera follow
camera.x=player.x-Math.sin(camera.rotY)*200;
camera.z=player.z-Math.cos(camera.rotY)*200;
camera.y=player.y+camera.offsetY+(camera.rotX*200);
}

// ===== PROJECT WORLD TO SCREEN =====
function project(x,y,z){
let dx=x-camera.x;
let dy=y-camera.y;
let dz=z-camera.z;

let scale=300/(dz+300);
return {
x:canvas.width/2+dx*scale,
y:canvas.height/2-dy*scale,
scale:scale
};
}

// ===== DRAW =====
function draw(){
ctx.fillStyle="black";
ctx.fillRect(0,0,canvas.width,canvas.height);

// ground
let g=project(0,0,0);
ctx.fillStyle="#111";
ctx.fillRect(0,g.y,canvas.width,canvas.height/2);

// player
let p=project(player.x,player.y,player.z);
ctx.fillStyle="white";
ctx.fillRect(p.x-20*p.scale,p.y-40*p.scale,40*p.scale,40*p.scale);

// pillars
for(let i=-1;i<=1;i++){
let pos=project(i*150,0,-100);
ctx.fillStyle="gray";
ctx.fillRect(pos.x-25,pos.y-150,pos.scale*50,150);
ctx.fillStyle="white";
ctx.fillText("HAPPY UPDATE",pos.x,pos.y-160);
}

// cake
let cake=project(0,0,-50);
ctx.fillStyle="pink";
ctx.fillRect(cake.x-60,cake.y-30,120,30);
ctx.fillStyle="yellow";
ctx.fillRect(cake.x-5,cake.y-60,10,30);

// sky text (di dunia)
let sky=project(0,300,-300);
ctx.fillStyle="white";
ctx.font="40px Arial";
ctx.textAlign="center";
ctx.fillText("selamat ulang tahun andika",sky.x,sky.y);
}

// ===== LOOP =====
function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
