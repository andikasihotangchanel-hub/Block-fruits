<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Gereja</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>
<body>

<audio id="bgm" src="ruang_kudus.mp3" loop></audio>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let audioStarted = false;
document.addEventListener("touchstart", () => {
  if(!audioStarted){
    document.getElementById("bgm").play();
    audioStarted = true;
  }
}, {once:true});

// ===== WORLD =====
let player = { x:0, y:0, z:0 };
let cam = { x:0, y:150, z:300, yaw:0 };
let sitting = false;

// ===== JOYSTICK =====
let joy = { active:false, x:0, y:0, dx:0, dy:0 };

canvas.addEventListener("touchstart", e=>{
  let t=e.touches[0];
  if(t.clientX < canvas.width/2){
    joy.active=true;
    joy.x=t.clientX;
    joy.y=t.clientY;
  }else{
    cam.yaw += 0.2;
  }

  // duduk
  if(Math.abs(player.x)<60 && Math.abs(player.z+200)<60){
    sitting = !sitting;
  }
});

canvas.addEventListener("touchmove", e=>{
  if(joy.active){
    let t=e.touches[0];
    joy.dx=t.clientX-joy.x;
    joy.dy=t.clientY-joy.y;
  }
});

canvas.addEventListener("touchend", ()=>{
  joy.active=false;
  joy.dx=0;
  joy.dy=0;
});

// ===== 3D PROJECTION =====
function project(x,y,z){
  let dx=x-cam.x;
  let dy=y-cam.y;
  let dz=z-cam.z;

  let cos=Math.cos(cam.yaw);
  let sin=Math.sin(cam.yaw);

  let rx=dx*cos - dz*sin;
  let rz=dx*sin + dz*cos;

  let scale=500/(rz+500);
  return {
    x:canvas.width/2 + rx*scale,
    y:canvas.height/2 + dy*scale,
    scale:scale,
    depth:rz
  };
}

// ===== UPDATE =====
function update(){
  if(!sitting){
    player.x += joy.dx*0.02;
    player.z += joy.dy*0.02;
  }

  cam.x = player.x;
  cam.z = player.z + 300;
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // ground
  ctx.fillStyle="#2e7d32";
  ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);

  // church body
  let c = project(0,0,-400);
  let size = 300*c.scale;

  ctx.fillStyle="#777";
  ctx.fillRect(c.x-size/2,c.y-size/2,size,size);

  ctx.fillStyle="#999";
  ctx.beginPath();
  ctx.moveTo(c.x-size/2,c.y-size/2);
  ctx.lineTo(c.x,c.y-size);
  ctx.lineTo(c.x+size/2,c.y-size/2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.fillRect(c.x-5,c.y-size+40,10,40);
  ctx.fillRect(c.x-20,c.y-size+55,40,10);

  // bench
  let b = project(0,0,-200);
  ctx.fillStyle="#5d4037";
  ctx.fillRect(b.x-80*b.scale,b.y-20*b.scale,160*b.scale,20*b.scale);

  // player
  let p = project(player.x,0,player.z);
  ctx.fillStyle="#1565c0";
  ctx.fillRect(p.x-20*p.scale,p.y-60*p.scale,40*p.scale,60*p.scale);

  ctx.fillStyle="#ffcc99";
  ctx.beginPath();
  ctx.arc(p.x,p.y-80*p.scale,20*p.scale,0,Math.PI*2);
  ctx.fill();

  // joystick
  if(joy.active){
    ctx.beginPath();
    ctx.arc(joy.x,joy.y,60,0,Math.PI*2);
    ctx.strokeStyle="white";
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(joy.x+joy.dx,joy.y+joy.dy,30,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
  }

  // buku saat duduk
  if(sitting){
    ctx.fillStyle="rgba(0,0,0,0.9)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#f5e6c8";
    ctx.fillRect(canvas.width/2-200,150,400,300);

    ctx.strokeStyle="#d2b48c";
    ctx.lineWidth=4;
    ctx.strokeRect(canvas.width/2-200,150,400,300);

    ctx.fillStyle="black";
    ctx.font="20px Arial";
    ctx.textAlign="center";

    ctx.fillText("Yesaya 53:5", canvas.width/2,190);
    ctx.fillText("Dia tertikam oleh karena pemberontakan kita,", canvas.width/2,220);
    ctx.fillText("diremukkan oleh karena kejahatan kita.", canvas.width/2,250);
    ctx.fillText("Ganjaran yang mendatangkan keselamatan", canvas.width/2,280);
    ctx.fillText("ditimpakan kepada-Nya.", canvas.width/2,310);

    ctx.fillText("Tap layar untuk berdiri", canvas.width/2,380);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
