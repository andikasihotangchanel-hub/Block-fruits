<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Parkour 3 Dunia</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }

/* Joystick */
.circle {
  width:60px; height:60px;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  position:fixed;
  bottom:20px;
}

#left { left:20px; }
#right { left:100px; }

#jump {
  right:40px;
  bottom:30px;
  position:fixed;
  width:70px; height:70px;
  border-radius:50%;
  background:white;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="left" class="circle"></div>
<div id="right" class="circle"></div>
<div id="jump"></div>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

// Player
let p = {x:50,y:300,w:30,h:30,vx:0,vy:0,onGround:false};
  
  // ===== EVENT HAPPY UPDATE =====
let enemy = {
  x: 700,
  y: 200,
  w: 30,
  h: 30,
  active: false
};

let enemySpawned = false;
let showText = false;
let textTimer = 0;

// Nyawa
let maxHP = 3;
let hp = 3;

// Spawn awal
const spawn = {x:50,y:300};

let gravity = 0.5;

// Platform
let plat = [
  // ===== TANAH (BUMI) =====
  {x:0,y:400,w:600,h:60},

  // ===== STAGE 1 (TENGAH) =====
  {x:200,y:300,w:150,h:20},
  {x:400,y:260,w:150,h:20},

  // GARIS KE STAGE 2
  {x:600,y:0,w:10,h:c.height},

  // ===== STAGE 2 (SEDIKIT ATAS) =====
  {x:650,y:240,w:150,h:20},
  {x:850,y:200,w:150,h:20},

  // GARIS KE STAGE 3
  {x:1100,y:0,w:10,h:c.height},

  // ===== STAGE 3 (LEBIH ATAS TAPI MASIH AMAN) =====
  {x:1150,y:180,w:150,h:20},
  {x:1350,y:150,w:150,h:20},

  // ===== FINISH BESAR =====
  {x:1600,y:130,w:120,h:120,finish:true}
];

// Kontrol
let left=false,right=false;

leftBtn = document.getElementById("left");
rightBtn = document.getElementById("right");
jumpBtn = document.getElementById("jump");

leftBtn.ontouchstart=()=>left=true;
leftBtn.ontouchend=()=>left=false;

rightBtn.ontouchstart=()=>right=true;
rightBtn.ontouchend=()=>right=false;

jumpBtn.ontouchstart=()=>{
  if(p.onGround){
    p.vy=-10;
    p.onGround=false;
  }
};

// Stage system
function stage(){
  if(p.x < 600){
    gravity=0.5; // bumi
    return 1;
  }
  else if(p.x < 1100){
    gravity=0.2; // atmosfer
    return 2;
  }
  else{
    gravity=0.05; // luar angkasa (masih ada sedikit tarik)
    return 3;
  }
}

function update(){
  let s = stage();

if(showText){
  if(Date.now() - textTimer > 10000){
    showText = false;
  }
}
  
  // ===== SPAWN MUSUH DI STAGE 2 =====
if(s == 2 && !enemySpawned){
  enemy.active = true;
  enemySpawned = true;

  showText = true;
  textTimer = Date.now();
}

  // ===== AI MUSUH =====
if(enemy.active){

  // ngejar player (lebih cepat)
  if(enemy.x < p.x) enemy.x += 2;
  else enemy.x -= 2;

  // gravitasi musuh
  enemy.vy = enemy.vy || 0;
  enemy.vy += 0.5;
  enemy.y += enemy.vy;

  // collision musuh dengan platform
  for(let i of plat){
    if(
      enemy.x < i.x+i.w &&
      enemy.x+enemy.w > i.x &&
      enemy.y < i.y+i.h &&
      enemy.y+enemy.h > i.y
    ){
      if(enemy.vy > 0){
        enemy.y = i.y - enemy.h;
        enemy.vy = 0;
      }
    }
  }
}
  
  // Gerak
  if(left) p.vx=-3;
  else if(right) p.vx=3;
  else p.vx=0;

// gravitasi tetap jalan
p.vy += gravity;

// ===== MAGNET DI LUAR ANGKASA =====
if(s == 3){
  let nearest = null;
  let minDist = Infinity;

  for(let i of plat){
    if(!i.finish && i.w != 10){
      let dx = (i.x + i.w/2) - (p.x + p.w/2);
      let dy = (i.y) - (p.y + p.h);
      let dist = Math.sqrt(dx*dx + dy*dy);

      if(dist < minDist){
        minDist = dist;
        nearest = i;
      }
    }
  }

  
  if(nearest){
    let targetY = nearest.y - p.h;

    // tarik ke arah platform (magnet)
    if(p.y < targetY){
      p.vy += 0.3;
    }
  }
}

// ===============================

p.x += p.vx;
p.y += p.vy;

  p.onGround=false;

  // Collision
  for(let i of plat){
    if(
      p.x < i.x+i.w &&
      p.x+p.w > i.x &&
      p.y < i.y+i.h &&
      p.y+p.h > i.y
    ){
      if(p.vy>0){
        p.y=i.y-p.h;
        p.vy=0;
        p.onGround=true;
      }

      if(i.finish){
        alert("FINISH!");
        reset();
      }
    }
  }

  // cegah naik terlalu tinggi di luar angkasa
if(stage() == 3 && p.vy < 0){
  p.vy *= 0.9; // rem gerakan ke atas
}
  
  // jatuh
  if(p.y > c.height){
    if(s==1){
      // jatuh ke tanah
      p.x=50;
      p.y=300;
    }else{
      // reset full
      reset();
    }
  }
}

function reset(){
  p.x=spawn.x;
  p.y=spawn.y;
  p.vy=0;
}

// Background beda tiap stage
function drawBG(s){
  if(s==1) ctx.fillStyle="skyblue";
  else if(s==2) ctx.fillStyle="#400000";
  else ctx.fillStyle="black";

  ctx.fillRect(0,0,c.width,c.height);
}

function draw(){
  let s = stage();

  drawBG(s);

  ctx.save();
  ctx.translate(-p.x+100,0);

  // Platform
  for(let i of plat){
    if(i.finish){
      ctx.fillStyle="yellow";
    }else if(i.w==10){
      ctx.fillStyle="lime"; // garis stage
    }else{
      ctx.fillStyle="green";
    }
    ctx.fillRect(i.x,i.y,i.w,i.h);
  }

  if(enemy.active){
  ctx.fillStyle = "red";
  ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
  }

  if(showText){
  ctx.fillStyle = "white";
  ctx.font = "16px Arial";
  ctx.fillText(
    "dia musuh pertama yang harus kamu lewati untuk menang berjuang lah",
    p.x - 100,
    50
  );
  }

  // Player
  ctx.fillStyle="white";
  ctx.fillRect(p.x,p.y,p.w,p.h);

  ctx.restore();
}

  // 💙 NYAWA (pojok kanan atas, lebih jelas)
for(let i=0;i<maxHP;i++){
  // kotak luar (border)
  ctx.strokeStyle = "white";
  ctx.strokeRect(c.width - 50 - (i*35), 20, 25, 25);

  // isi
  if(i < hp){
    ctx.fillStyle = "blue";
    ctx.fillRect(c.width - 50 - (i*35), 20, 25, 25);
  } else {
    ctx.fillStyle = "black";
    ctx.fillRect(c.width - 50 - (i*35), 20, 25, 25);
  }
}

  // ===== KENA MUSUH =====
if(enemy.active){
  if(
    p.x < enemy.x + enemy.w &&
    p.x + p.w > enemy.x &&
    p.y < enemy.y + enemy.h &&
    p.y + p.h > enemy.y
  ){
    hp -= 1;

    // reset posisi player
    reset();

    if(hp <= 0){
      alert("GAME OVER");
      location.reload();
    }
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
