<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota Final 100%</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;font-family:Arial}
canvas{display:block}
#nameScreen{
position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:flex;justify-content:center;align-items:center;
flex-direction:column;color:white;z-index:10;
}
#nameScreen input{padding:10px;font-size:18px;margin:10px}
#nameScreen button{padding:10px 20px;font-size:18px}
#joystick{
position:fixed;bottom:30px;left:30px;
width:110px;height:110px;
background:rgba(0,0,0,0.3);
border-radius:50%;touch-action:none;
}
#stick{
position:absolute;width:50px;height:50px;
background:white;border-radius:50%;
left:30px;top:30px;
}
</style>
</head>
<body>

<div id="nameScreen">
<h2>Masukkan Nama</h2>
<input type="text" id="nameInput">
<button onclick="startGame()">Mulai</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let playerName="Player";
function startGame(){
let n=document.getElementById("nameInput").value;
if(n.trim()!="") playerName=n;
document.getElementById("nameScreen").style.display="none";
}

/* PLAYER */
let player={
x:0,
y:0,
angle:0,
speed:2
};

/* CAMERA */
let camera={
angle:0
};

/* JOYSTICK */
let joyX=0,joyY=0,active=false;
let joy=document.getElementById("joystick");
let stick=document.getElementById("stick");

joy.addEventListener("touchstart",()=>active=true);
joy.addEventListener("touchend",()=>{
active=false;joyX=0;joyY=0;
stick.style.left="30px";
stick.style.top="30px";
});
joy.addEventListener("touchmove",e=>{
if(!active)return;
let r=joy.getBoundingClientRect();
let t=e.touches[0];
let x=t.clientX-r.left-55;
let y=t.clientY-r.top-55;
let d=Math.sqrt(x*x+y*y);
if(d>45){x*=45/d;y*=45/d;}
joyX=x/45;
joyY=y/45;
stick.style.left=(30+x)+"px";
stick.style.top=(30+y)+"px";
});

/* SWIPE KAMERA (LAYAR KANAN) */
let lastTouchX=null;

canvas.addEventListener("touchstart",e=>{
let t=e.touches[0];
if(t.clientX>canvas.width/2){
lastTouchX=t.clientX;
}
});

canvas.addEventListener("touchmove",e=>{
let t=e.touches[0];
if(t.clientX>canvas.width/2 && lastTouchX!==null){
let delta=t.clientX-lastTouchX;
camera.angle+=delta*0.005;
lastTouchX=t.clientX;
}
});

canvas.addEventListener("touchend",()=>{
lastTouchX=null;
});

/* WARNA */
let colors=["#FF5733","#33C1FF","#8D33FF","#33FF57","#FFC300","#FF33A8"];

/* BANGUNAN */
let houses=[];
for(let i=0;i<60;i++){
houses.push({
x:(Math.random()-0.5)*200,
y:Math.random()*400+40,
color:colors[Math.floor(Math.random()*colors.length)]
});
}

/* UPDATE */
function update(){

let move = -joyY * player.speed;

if(move!==0){
player.angle=camera.angle;
player.x+=Math.sin(camera.angle)*move;
player.y+=Math.cos(camera.angle)*move;
}
}

/* DRAW */
function draw(){

ctx.fillStyle="#87CEEB";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#228B22";
ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);

ctx.save();
ctx.translate(canvas.width/2,canvas.height/2);

/* SORT BANGUNAN BIAR TIDAK BUG DEPTH */
houses.sort((a,b)=>{
let da=(a.y-player.y);
let db=(b.y-player.y);
return db-da;
});

/* render bangunan */
houses.forEach(h=>{
let dx=h.x-player.x;
let dy=h.y-player.y;

let rx=dx*Math.cos(-camera.angle)-dy*Math.sin(-camera.angle);
let ry=dx*Math.sin(-camera.angle)+dy*Math.cos(-camera.angle);

if(ry>5){
let scale = 300/ry;

let width = 40 * scale;
let height = 60 * scale;   // tinggi beda supaya lebih balok

ctx.fillStyle = h.color;

// posisi dasar bangunan tetap di tanah
ctx.fillRect(
    rx*scale - width/2,
    -height,
    width,
    height
);
}
});

ctx.restore();

/* PLAYER */
let px=canvas.width/2;
let py=canvas.height/2;

// kaki
ctx.fillStyle="black";
ctx.fillRect(px-10,py+10,8,20);
ctx.fillRect(px+2,py+10,8,20);

// badan
ctx.fillStyle="blue";
ctx.fillRect(px-15,py-10,30,25);

// kepala
ctx.fillStyle="yellow";
ctx.fillRect(px-12,py-30,24,20);

// nama
ctx.fillStyle="black";
ctx.textAlign="center";
ctx.fillText(playerName,px,py-40);
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();
</script>
