<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Camera Mode</title>
<style>
body{margin:0;overflow:hidden;background:black;}
canvas{display:block;}

#joystickBase{
position:fixed;
left:40px;
bottom:60px;
width:120px;
height:120px;
background:rgba(255,255,255,0.2);
border-radius:50%;
}
#joystickStick{
position:fixed;
left:80px;
bottom:100px;
width:60px;
height:60px;
background:blue;
border-radius:50%;
}
#jumpBtn{
position:fixed;
right:40px;
bottom:80px;
width:70px;
height:70px;
border-radius:50%;
border:none;
background:red;
color:white;
font-size:18px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="joystickBase"></div>
<div id="joystickStick"></div>
<button id="jumpBtn">JUMP</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = {
x: 0,
y: 0,
width:40,
height:80,
velocityY:0,
jumping:false
};

let cameraX = 0;

// ===== EVENT =====
const isHappyUpdate = true;

// ===== JOYSTICK PLAYER =====
let joyStick = document.getElementById("joystickStick");
let draggingJoy = false;
let baseX = 100;

document.addEventListener("touchstart",(e)=>{
if(e.touches[0].clientX < 200){
draggingJoy=true;
}else{
draggingCam=true;
lastTouchX = e.touches[0].clientX;
}
});

document.addEventListener("touchend",()=>{
draggingJoy=false;
draggingCam=false;
joyStick.style.left="80px";
joyStick.style.bottom="100px";
});

let draggingCam = false;
let lastTouchX = 0;

document.addEventListener("touchmove",(e)=>{
let touch=e.touches[0];

if(draggingJoy){
let dx=touch.clientX-baseX;
if(dx>40)dx=40;
if(dx<-40)dx=-40;
joyStick.style.left=(80+dx)+"px";
player.x+=dx*0.2;
}

if(draggingCam){
let dx = touch.clientX - lastTouchX;
cameraX -= dx;
lastTouchX = touch.clientX;
}
});

// ===== JUMP =====
document.getElementById("jumpBtn").addEventListener("touchstart",()=>{
if(!player.jumping){
player.velocityY=-12;
player.jumping=true;
}
});

// ===== UPDATE =====
function update(){
if(player.jumping){
player.y+=player.velocityY;
player.velocityY+=0.6;
if(player.y>=0){
player.y=0;
player.jumping=false;
}
}
}

// ===== DRAW =====
function draw(){

ctx.fillStyle="#0a0f1f";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#1e7a1e";
ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);

let centerX = canvas.width/2 - cameraX;
let groundY = canvas.height/2;

// ===== TEXT =====
ctx.fillStyle="gold";
ctx.font="60px Arial";
ctx.textAlign="center";
ctx.fillText("SELAMAT ULANG TAHUN", centerX, 110);

ctx.font="70px Arial";
ctx.fillText("ANDIKA", centerX, 170);

ctx.font="35px Arial";
ctx.fillText("HAPPY UPDATE", centerX, 220);

// ===== TIANG =====
ctx.fillStyle="white";
ctx.fillRect(centerX-200, groundY-200, 40, 200);
ctx.fillRect(centerX-20, groundY-200, 40, 200);
ctx.fillRect(centerX+160, groundY-200, 40, 200);

// ===== KUE =====
ctx.fillStyle="#8B4513";
ctx.fillRect(centerX-100, groundY+20, 200, 70);

ctx.fillStyle="pink";
ctx.fillRect(centerX-100, groundY, 200, 30);

// ===== PLAYER =====
let screenX = player.x - cameraX;
let ground = canvas.height/2;

ctx.fillStyle="yellow";
ctx.fillRect(screenX, ground-80+player.y, 40, 30);

ctx.fillStyle="blue";
ctx.fillRect(screenX, ground-50+player.y, 40, 40);

}

function gameLoop(){
update();
draw();
requestAnimationFrame(gameLoop);
}
gameLoop();
</script>

</body>
</html>
