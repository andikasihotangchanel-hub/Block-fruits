<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota Upgrade</title>
<style>
body{margin:0;overflow:hidden;background:skyblue;font-family:Arial}
canvas{display:block}

#nameScreen{
position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:flex;justify-content:center;align-items:center;
flex-direction:column;color:white;z-index:10;
}
#nameScreen input{padding:10px;font-size:18px;margin:10px}
#nameScreen button{padding:10px 20px;font-size:18px}

#joystick{
position:fixed;bottom:30px;left:30px;
width:110px;height:110px;
background:rgba(0,0,0,0.3);
border-radius:50%;touch-action:none;
}
#stick{
position:absolute;width:50px;height:50px;
background:white;border-radius:50%;
left:30px;top:30px;
}
</style>
</head>
<body>

<div id="nameScreen">
<h2>Masukkan Nama</h2>
<input type="text" id="nameInput">
<button onclick="startGame()">Mulai</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let playerName="Player";
function startGame(){
let n=document.getElementById("nameInput").value;
if(n.trim()!="") playerName=n;
document.getElementById("nameScreen").style.display="none";
}

/* PLAYER */
let player={
x:500,y:500,
w:50,h:70,
speed:4,
dir:"down"
};

let camera={x:0,y:0};
let world="outside";

/* KEYBOARD */
let keys={};
window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

/* JOYSTICK */
let joyX=0,joyY=0,active=false;
let joy=document.getElementById("joystick");
let stick=document.getElementById("stick");

joy.addEventListener("touchstart",()=>active=true);
joy.addEventListener("touchend",()=>{
active=false;joyX=0;joyY=0;
stick.style.left="30px";
stick.style.top="30px";
});
joy.addEventListener("touchmove",e=>{
if(!active)return;
let r=joy.getBoundingClientRect();
let t=e.touches[0];
let x=t.clientX-r.left-55;
let y=t.clientY-r.top-55;
let d=Math.sqrt(x*x+y*y);
if(d>45){x*=45/d;y*=45/d;}
joyX=x/45;joyY=y/45;
stick.style.left=(30+x)+"px";
stick.style.top=(30+y)+"px";
});

/* MAP LUAR */
let houses=[
{x:800,y:500,w:180,h:160},
{x:1300,y:900,w:180,h:160}
];

let buildings=[];
for(let i=0;i<30;i++){
buildings.push({
x:Math.random()*3000,
y:Math.random()*2000,
w:120+Math.random()*80,
h:120+Math.random()*80
});
}

/* COLLISION */
function collide(a,b){
return a.x<a.x+a.w &&
a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y+a.h>b.y &&
a.y<b.y+b.h;
}

/* UPDATE */
function update(){

let moveX=0,moveY=0;

if(keys["w"]||keys["ArrowUp"]) moveY-=1;
if(keys["s"]||keys["ArrowDown"]) moveY+=1;
if(keys["a"]||keys["ArrowLeft"]) moveX-=1;
if(keys["d"]||keys["ArrowRight"]) moveX+=1;

moveX+=joyX;
moveY+=joyY;

if(moveX>0) player.dir="right";
if(moveX<0) player.dir="left";
if(moveY>0) player.dir="down";
if(moveY<0) player.dir="up";

player.x+=moveX*player.speed;
player.y+=moveY*player.speed;

/* MASUK RUMAH */
if(world=="outside"){
houses.forEach(h=>{
if(player.x+player.w>h.x &&
player.x<h.x+h.w &&
player.y+player.h>h.y &&
player.y<h.y+h.h){
world="inside";
player.x=300;
player.y=300;
}
});
}

/* KELUAR RUMAH */
if(world=="inside"){
if(player.x<0){
world="outside";
player.x=780;
player.y=520;
}
}

camera.x=player.x-canvas.width/2+player.w/2;
camera.y=player.y-canvas.height/2+player.h/2;
}

/* DRAW PLAYER STYLE LAMA */
function drawPlayer(){
ctx.fillStyle="red";
ctx.fillRect(player.x,player.y,player.w,player.h);

ctx.fillStyle="black";

/* tanda arah hadap */
if(player.dir=="up")
ctx.fillRect(player.x+15,player.y-8,20,8);

if(player.dir=="down")
ctx.fillRect(player.x+15,player.y+player.h,20,8);

if(player.dir=="left")
ctx.fillRect(player.x-8,player.y+20,8,20);

if(player.dir=="right")
ctx.fillRect(player.x+player.w,player.y+20,8,20);

ctx.font="16px Arial";
ctx.textAlign="center";
ctx.fillText(playerName,player.x+player.w/2,player.y-12);
}

/* DRAW */
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.save();
ctx.translate(-camera.x,-camera.y);

if(world=="outside"){

/* jalan */
ctx.fillStyle="#777";
ctx.fillRect(-2000,600,6000,200);

/* bangunan kota */
buildings.forEach(b=>{
ctx.fillStyle="#555";
ctx.fillRect(b.x,b.y,b.w,b.h);
ctx.fillStyle="#999";
ctx.fillRect(b.x+10,b.y+10,b.w-20,20);
});

/* rumah */
houses.forEach(h=>{
ctx.fillStyle="brown";
ctx.fillRect(h.x,h.y,h.w,h.h);
ctx.fillStyle="darkred";
ctx.fillRect(h.x+60,h.y+80,50,70);
});

}

if(world=="inside"){
ctx.fillStyle="#ddd";
ctx.fillRect(0,0,2000,2000);
ctx.fillStyle="#aaa";
ctx.fillRect(200,200,400,200);
}

drawPlayer();

ctx.restore();
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
