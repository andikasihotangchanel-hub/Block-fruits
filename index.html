<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota Final</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#87CEEB;}
canvas{display:block;}

/* ===== LAYAR NAMA ===== */
#nameScreen{
position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:flex;justify-content:center;align-items:center;
flex-direction:column;color:white;z-index:10;
}
#nameScreen input{padding:10px;font-size:18px;margin:10px;}
#nameScreen button{padding:10px 20px;font-size:18px;}

/* ===== JOYSTICK MOBILE ===== */
#joystick{
position:fixed;bottom:30px;left:30px;
width:110px;height:110px;
background:rgba(0,0,0,0.3);
border-radius:50%;touch-action:none;
}
#stick{
position:absolute;width:50px;height:50px;
background:white;border-radius:50%;
left:30px;top:30px;
}

/* ===== TOMBOL LOMPAT ===== */
#jumpBtn{
position:absolute;right:30px;bottom:80px;
width:80px;height:80px;border-radius:50%;
background:#ff4444;color:white;font-weight:bold;
border:none;font-size:18px;box-shadow:0 4px 8px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<div id="nameScreen">
<h2>Masukkan Nama</h2>
<input type="text" id="nameInput">
<button onclick="startGame()">Mulai</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<button id="jumpBtn">JUMP</button>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();
window.addEventListener("resize",resize);

/* ===== PLAYER ===== */
let playerName="Player";
let player={x:0,y:0,angle:0,speed:3,jumpV:0,isJumping:false};

const groundY = canvas.height - 150;

/* ===== START GAME ===== */
function startGame(){
let n=document.getElementById("nameInput").value;
if(n.trim()!="") playerName=n;
document.getElementById("nameScreen").style.display="none";
}

/* ===== JOYSTICK ===== */
let joy=document.getElementById("joystick");
let stick=document.getElementById("stick");
let joyX=0,joyY=0,active=false;

joy.addEventListener("touchstart",()=>active=true);
joy.addEventListener("touchend",()=>{
active=false;joyX=0;joyY=0;
stick.style.left="30px";stick.style.top="30px";
});
joy.addEventListener("touchmove",e=>{
if(!active)return;
let r=joy.getBoundingClientRect();
let t=e.touches[0];
let x=t.clientX-r.left-55;
let y=t.clientY-r.top-55;
let d=Math.sqrt(x*x+y*y);
if(d>45){x*=45/d;y*=45/d;}
joyX=x/45; joyY=y/45;
stick.style.left=(30+x)+"px"; stick.style.top=(30+y)+"px";
});

/* ===== KEYBOARD ===== */
let keys={};
window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* ===== BANGUNAN 2D ===== */
let buildingColors=["#c2b280","#ffcc66","#99cc99","#9999ff","#ff9999"];
let buildings=[];
for(let i=0;i<50;i++){
buildings.push({
x:(Math.random()-0.5)*2000,
y:(Math.random()-0.5)*2000,
width:60+Math.random()*40,
height:60+Math.random()*100,
color:buildingColors[Math.floor(Math.random()*buildingColors.length)]
});
}

/* ===== TOMBOL LOMPAT ===== */
const jumpBtn=document.getElementById("jumpBtn");
jumpBtn.addEventListener("click",jump);
jumpBtn.addEventListener("touchstart",jump);

function jump(){
if(!player.isJumping){
player.jumpV=-12;
player.isJumping=true;
}
}

/* ===== UPDATE ===== */
let cameraAngle=0;
function update(){

// Keyboard
let moveF=0,moveR=0;
if(keys["w"]||keys["arrowup"]) moveF=1;
if(keys["s"]||keys["arrowdown"]) moveF=-1;
if(keys["a"]||keys["arrowleft"]) moveR=-1;
if(keys["d"]||keys["arrowright"]) moveR=1;

// Mobile joystick
moveF += -joyY;
cameraAngle += joyX*0.05;

// Gerak player maju mundur mengikuti kamera
let moveDist = moveF * player.speed;
player.x += Math.sin(cameraAngle)*moveDist;
player.y += Math.cos(cameraAngle)*moveDist;

// Lompat
if(player.isJumping){
player.y += player.jumpV;
player.jumpV += 0.7;
if(player.y >= groundY){
player.y=groundY;
player.isJumping=false;
}
}
}

/* ===== DRAW ===== */
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

// background & ground
ctx.fillStyle="#87CEEB"; ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#228B22"; ctx.fillRect(0,groundY,canvas.width,canvas.height-groundY);

// camera translate
ctx.save();
ctx.translate(canvas.width/2,canvas.height/2);

// draw buildings
buildings.forEach(b=>{
let dx=b.x-player.x;
let dy=b.y-player.y;
let rx=dx*Math.cos(-cameraAngle)-dy*Math.sin(-cameraAngle);
let ry=dx*Math.sin(-cameraAngle)+dy*Math.cos(-cameraAngle);

if(ry>0){
let scale=150/(ry+0.1);
let w=b.width*scale/100;
let h=b.height*scale/100;
ctx.fillStyle=b.color;
ctx.fillRect(rx*scale-w/2,-h,w,h);
}
});

// draw player
let px=0,py=0;
// kaki
ctx.fillStyle="black";
ctx.fillRect(px-10,py+10,8,20);
ctx.fillRect(px+2,py+10,8,20);
// badan
ctx.fillStyle="blue";
ctx.fillRect(px-15,py-10,30,25);
// kepala
ctx.fillStyle="yellow";
ctx.fillRect(px-12,py-30,24,20);
// nama
ctx.fillStyle="black";
ctx.textAlign="center";
ctx.fillText(playerName,px,py-40);

ctx.restore();
}

/* ===== GAME LOOP ===== */
function loop(){update();draw();requestAnimationFrame(loop);}
loop();

</script>
</body>
</html>
