<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Parkour 4 Dunia</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }

.circle {
  width:60px; height:60px;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  position:fixed;
  bottom:20px;
}
#left { left:20px; }
#right { left:100px; }

#jump {
  right:40px;
  bottom:30px;
  position:fixed;
  width:70px; height:70px;
  border-radius:50%;
  background:white;
}

.circle, #jump {
  touch-action: none;
  user-select: none;
}
  
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="left" class="circle"></div>
<div id="right" class="circle"></div>
<div id="jump"></div>

<script>

  window.onerror = function(msg, url, line){
  alert("ERROR: " + msg + " di baris " + line);
  }

// ===== CANVAS =====
const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

// ===== BAN SYSTEM =====

const GAME_VERSION = "1.1"; // ganti tiap update
  
let banned = false;
let banEndTime = Number(localStorage.getItem("banTime"));

if(banEndTime && Date.now() < banEndTime){
  banned = true;
}else{
  localStorage.removeItem("banTime");
}

  let savedVersion = localStorage.getItem("gameVersion");

if(savedVersion !== GAME_VERSION){

  // 🔥 kalau player lagi kena ban → reset jadi 2 menit
  if(banned){
    let resetTime = 2 * 60 * 1000 + 59 * 1000; // 2:59
    let newBan = Date.now() + resetTime;

    localStorage.setItem("banTime", newBan);

    banEndTime = newBan;
  }

  // simpan versi terbaru
  localStorage.setItem("gameVersion", GAME_VERSION);
}

function triggerBan(level="normal"){
  let min=0, max=0;

  if(level=="ringan"){ min=2*60*1000; max=10*60*1000; }
  else if(level=="normal"){ min=10*60*1000; max=2*60*60*1000; }
  else { min=2*60*60*1000; max=24*60*60*1000; }

  let random = Math.random()*(max-min)+min;
  banEndTime = Date.now()+random;

  localStorage.setItem("banTime", banEndTime);
  banned = true;
}

// ===== PLAYER =====
let spawn = {x:50,y:400};
let p = {x:50,y:400,w:30,h:30,vx:0,vy:0,onGround:false};

let camX = 0;

  let jumpBuffer = 0;
  
let gravity = 0.5;

// ===== HP =====
let maxHP = 3;
let hp = 3;

// ===== SAFE TIME (ANTI BAN SALAH) =====
let safeTime = 0;

// ===== TRACK =====
let lastX = p.x;
let regenCount = 0;
let lastRegenTime = 0;

// ===== ENEMY =====
let enemy = {
  x:700,
  y:200,
  w:30,
  h:30,
  active:false,
  vy:0,
  onGround:false,

  hp:3,
  maxHP:3,

  state:"normal", // normal / lemah
  lastSwitch:0
};

  let chats = [];

function addChat(sender, text){
  chats.push({
    sender: sender,
    text: text,
    time: Date.now()
  });
}

//==== PARTICLE ====
  let particles = [];

function spawnParticles(x,y){
  try{
    for(let i=0;i<30;i++){
      particles.push({
        x:x,
        y:y,
        vx:(Math.random()-0.5)*4,
        vy:Math.random()*-5,
        life:60
      });
    }
  }catch(e){
    console.log(e);
  }
}

// ===== REGEN =====
let regen = {x:0,y:0,w:120,h:20,active:false};
let healing = false;
let healStart = 0;

// ===== MODE =====
let mode = "normal";

// ===== PLATFORM =====
let plat = [];
  
function generatePlatform(){
  plat = [];

  // lantai awal
  plat.push({x:0,y:450,w:800,h:80});

  let x = 300;

  for(let i=0;i<20;i++){

    // jarak antar AREA (bukan platform)
    x += 200 + Math.random()*200;

    let baseY = 200 + Math.random()*200;

    // tiap area punya 2-4 platform kecil
    let jumlah = 2 + Math.floor(Math.random()*3);

    for(let j=0;j<jumlah;j++){
      plat.push({
        x: x + Math.random()*150,
        y: baseY + (Math.random()*100 - 50),
        w: 80 + Math.random()*60,
        h: 20
      });
    }
  }

  // pembatas dunia
  plat.push({x:800,y:0,w:10,h:600});
  plat.push({x:1500,y:0,w:10,h:600});
  plat.push({x:2200,y:0,w:10,h:600});

  // finish jauh banget
  plat.push({
    x: x + 300,
    y: 200,
    w:150,
    h:150,
    finish:true
  });
}
  
generatePlatform();
  
// ===== CONTROL =====
let left=false,right=false;

function pressLeft(e){
  e.preventDefault();
  left = true;
}
function releaseLeft(){
  left = false;
}

function pressRight(e){
  e.preventDefault();
  right = true;
}
function releaseRight(){
  right = false;
}

function pressJump(e){
  e.preventDefault();

  // buffer lompat biar gak miss
  jumpBuffer = Date.now();
}

// EVENT TOUCH + MOUSE (biar fleksibel)
leftBtn.addEventListener("touchstart", pressLeft);
leftBtn.addEventListener("touchend", releaseLeft);
leftBtn.addEventListener("mousedown", pressLeft);
leftBtn.addEventListener("mouseup", releaseLeft);

rightBtn.addEventListener("touchstart", pressRight);
rightBtn.addEventListener("touchend", releaseRight);
rightBtn.addEventListener("mousedown", pressRight);
rightBtn.addEventListener("mouseup", releaseRight);

jumpBtn.addEventListener("touchstart", pressJump);
jumpBtn.addEventListener("mousedown", pressJump);

// ===== STAGE =====
function stage(){
  if(p.x < 800){ gravity=0.5; return 1; }
  else if(p.x < 1500){ gravity=0.2; return 2; }
  else if(p.x < 2200){ gravity=0.08; return 3; }
  else{ gravity=0.03; return 4; }
}

// ===== UPDATE =====
function update(){

  if(banned) return;

  let s = stage();

  // gerak
  p.vx = left?-5:right?5:0;
  p.vy += gravity;
  p.x += p.vx;
  p.y += p.vy;

  // anti teleport (AMAN)
  if(Date.now() - safeTime > 1000){

  let speedX = Math.abs(p.vx);
  let distanceX = Math.abs(p.x - lastX);

  // 🚫 BAN hanya jika gerak horizontal terlalu cepat
  if(distanceX > 1000 && speedX > 8){
    triggerBan("berat");
  }

  }
  
  lastX = p.x;

  p.onGround = false;

  // ===== COLLISION PLATFORM =====
  for(let i of plat){
    if(
      p.x < i.x+i.w &&
      p.x+p.w > i.x &&
      p.y < i.y+i.h &&
      p.y+p.h > i.y
    ){
      if(p.vy > 0){
        p.y = i.y - p.h;
        p.vy = 0;
        p.onGround = true;
      }

      if(i.finish){
        alert("FINISH!");
        location.reload();
      }
    }
  }

  // ===== JUMP BUFFER =====
if(Date.now() - jumpBuffer < 150 && p.onGround){
  p.vy = -10;
  p.onGround = false;
  jumpBuffer = 0;
}

  // ===== SPAWN REGEN =====
  if(!regen.active && Math.random()<0.002){
    regen.active=true;
    regen.x=p.x+100+Math.random()*200;
    regen.y=200;
  }

  // ===== REGEN COLLISION =====
  if(regen.active){
    if(
      p.x < regen.x+regen.w &&
      p.x+p.w > regen.x &&
      p.y < regen.y+regen.h &&
      p.y+p.h > regen.y
    ){
      if(p.y + p.h <= regen.y + 10){
        p.y = regen.y - p.h;
        p.vy = 0;
        p.onGround = true;

        if(hp < maxHP && !healing){
          healing = true;
          healStart = Date.now();
        }
      }
    }
  }

  // ===== HEAL =====
  if(healing && Date.now()-healStart > 1000){
    if(Date.now()-lastRegenTime < 2000) regenCount++;
    else regenCount = 1;

    if(regenCount > 5) triggerBan("normal");

    lastRegenTime = Date.now();
    hp = maxHP;
    healing = false;
    regen.active = false;
  }

  // ===== ENEMY =====
  if(s==2){
    enemy.active=true;
  }

  // ===== ENEMY LOGIC =====
if(enemy.active){

  // MODE LENGAH
  if(Date.now() - enemy.lastSwitch > (enemy.state=="normal" ? 50000 : 20000)){
    enemy.state = enemy.state=="normal" ? "lemah" : "normal";
    enemy.lastSwitch = Date.now();
  }

  // GERAK MUSUH
  let dx = p.x - enemy.x;

  if(Math.abs(dx)>5){
    enemy.x += dx>0 ? 2 : -2;
  }
// LOMPAT 
  if(Math.abs(dx) < 100 && enemy.onGround){
  enemy.vy = -8; // musuh bisa lompat
  }

  // GRAVITY MUSUH
  enemy.vy += 0.5;
  enemy.y += enemy.vy;

  // COLLISION MUSUH
  for(let i of plat){
    if(
      enemy.x < i.x+i.w &&
      enemy.x+enemy.w > i.x &&
      enemy.y < i.y+i.h &&
      enemy.y+enemy.h > i.y
    ){
      if(enemy.vy>0){
        enemy.y = i.y - enemy.h;
        enemy.vy = 0;
      }
    }
  }

}

  // ===== KENA MUSUH =====
  if(enemy.active){
  if(p.x < enemy.x+enemy.w && p.x+p.w > enemy.x &&
     p.y < enemy.y+enemy.h && p.y+p.h > enemy.y){

    // ✅ kalau lompat dari atas & musuh lagi lemah
    if(p.vy > 0 && p.y + p.h <= enemy.y + 10 && enemy.state=="lemah"){
      
      enemy.hp--;
      p.vy = -8; // mantul dikit

      addChat("player","Hancur sekarang!");
      addChat("enemy","Kau berani juga...");

      if(enemy.hp <= 0){
        enemy.active = false;
        spawnParticles(enemy.x, enemy.y);
        addChat("player","Selesai akhirnya.");
      }

    } else {
      // ❌ kena biasa
      hp--;
      reset();
      safeTime = Date.now();

      addChat("enemy","Kau tidak bisa mengalahkanku!");

      if(hp<=0){
        alert("GAME OVER");
        location.reload();
      }
    }
  }
  }

  if(p.y > c.height) reset();

  for(let i of particles){
  i.x += i.vx;
  i.y += i.vy;
  i.vy += 0.2;
  i.life--;
}

particles = particles.filter(p=>p.life>0);
}

// ===== RESET =====
function reset(){
  p.x=spawn.x;
  p.y=spawn.y;
  p.vy=0;
}

// ===== DRAW =====
function draw(){

  if(banned){
    ctx.fillStyle="black";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle="red";
    ctx.font="bold 40px Arial";
    ctx.textAlign="center";
    ctx.fillText("BANNED", c.width/2,150);

    let sisa = banEndTime - Date.now();
    let jam = Math.floor(sisa/3600000);
    let menit = Math.floor((sisa%3600000)/60000);
    let detik = Math.floor((sisa%60000)/1000);

    ctx.fillStyle="white";
    ctx.fillText(jam+":"+menit+":"+detik, c.width/2,250);
    return;
  }

  let s = stage();
  if(!s) return;

  // background
  if(s==1) ctx.fillStyle="skyblue";
  else if(s==2) ctx.fillStyle="#400000";
  else if(s==3) ctx.fillStyle="black";
  else{
    let g = ctx.createLinearGradient(0,0,c.width,c.height);
    g.addColorStop(0,"black");
    g.addColorStop(0.5,"pink");
    g.addColorStop(1,"white");
    ctx.fillStyle=g;
  }

  ctx.fillRect(0,0,c.width,c.height);

 ctx.save();

// smooth follow
camX += (p.x - camX - 100) * 0.3;

// 🚫 anti ketinggalan
if(Math.abs(p.x - camX) > 500){
  camX = p.x - 100;
}

ctx.translate(-camX,0);

  // platform
  for(let i of plat){
    ctx.fillStyle = i.finish?"yellow":i.w==10?"lime":"green";
    ctx.fillRect(i.x,i.y,i.w,i.h);
  }

  // regen
  if(regen.active){
    ctx.fillStyle="#00FFFF";
    ctx.fillRect(regen.x,regen.y,regen.w,regen.h);
  }

  // enemy
if(enemy.active){
  ctx.fillStyle = enemy.state=="lemah" ? "black" : "red";
  ctx.fillRect(enemy.x,enemy.y,enemy.w,enemy.h);
}

  // player
  ctx.fillStyle="white";
  ctx.fillRect(p.x,p.y,p.w,p.h);

  for(let i of particles){
  ctx.fillStyle = `hsl(${Math.random()*360},100%,50%)`;
  ctx.fillRect(i.x,i.y,5,5);
  }

  ctx.restore();

  // HP UI
  for(let i=0;i<maxHP;i++){
    ctx.strokeStyle="white";
    ctx.strokeRect(c.width-50-(i*35),20,25,25);
    ctx.fillStyle = i<hp?"blue":"black";
    ctx.fillRect(c.width-50-(i*35),20,25,25);
  }

let yPos = c.height - 80;

for(let i=chats.length-1;i>=0;i--){
  let chat = chats[i];

  if(Date.now() - chat.time > 4000) continue;

  ctx.fillStyle = chat.sender=="player" ? "cyan" : "red";
  ctx.font = "14px Arial";

  ctx.fillText(
    (chat.sender=="player"?"Player: ":"Musuh: ") + chat.text,
    50,
    yPos
  );

  yPos -= 20;
}
  
}

// ===== LOOP =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
