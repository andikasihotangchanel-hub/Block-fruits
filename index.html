<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota Final</title>
<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background:#87CEEB;
}
canvas{display:block;}

/* ===== JOYSTICK ===== */
#joystick{
  position:fixed;
  bottom:30px;
  left:30px;
  width:110px;height:110px;
  background:rgba(0,0,0,0.3);
  border-radius:50%;
  touch-action:none;
}
#stick{
  position:absolute;
  width:50px;height:50px;
  background:white;border-radius:50%;
  left:30px;top:30px;
}

/* ===== JUMP BUTTON ===== */
#jumpBtn{
  position:absolute;
  right:30px;
  bottom:80px;
  width:80px;
  height:80px;
  border-radius:50%;
  background:#ff4444;
  color:white;
  font-weight:bold;
  border:none;
  font-size:18px;
  box-shadow:0 4px 8px rgba(0,0,0,0.3);
}

/* ===== NAMA PLAYER ===== */
#nameScreen{
  position:fixed;width:100%;height:100%;
  background:rgba(0,0,0,0.8);
  display:flex;justify-content:center;align-items:center;
  flex-direction:column;color:white;z-index:10;
}
#nameScreen input{padding:10px;font-size:18px;margin:10px;}
#nameScreen button{padding:10px 20px;font-size:18px;}
</style>
</head>
<body>

<div id="nameScreen">
<h2>Masukkan Nama</h2>
<input type="text" id="nameInput" placeholder="Nama...">
<button onclick="startGame()">Mulai</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<button id="jumpBtn">JUMP</button>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

/* ===== PLAYER ===== */
let playerName="Player";
function startGame(){
  let n=document.getElementById("nameInput").value.trim();
  if(n!="") playerName=n;
  document.getElementById("nameScreen").style.display="none";
}

let player={
  x:0,
  y:0,
  angle:0,
  speed:0.08,
  jumpVel:0,
  onGround:true
};

/* ===== CAMERA ===== */
let camera={angle:0};

/* ===== JOYSTICK ===== */
let joyX=0,joyY=0,joyActive=false;
let joy=document.getElementById("joystick");
let stick=document.getElementById("stick");

joy.addEventListener("touchstart",()=>joyActive=true);
joy.addEventListener("touchend",()=>{
  joyActive=false;
  joyX=0; joyY=0;
  stick.style.left="30px"; stick.style.top="30px";
});
joy.addEventListener("touchmove",e=>{
  if(!joyActive) return;
  let r=joy.getBoundingClientRect();
  let t=e.touches[0];
  let x=t.clientX-r.left-55;
  let y=t.clientY-r.top-55;
  let d=Math.sqrt(x*x+y*y);
  if(d>45){x*=45/d;y*=45/d;}
  joyX=x/45;
  joyY=y/45;
  stick.style.left=(30+x)+"px"; stick.style.top=(30+y)+"px";
});

/* ===== JUMP ===== */
let jumpBtn=document.getElementById("jumpBtn");
jumpBtn.addEventListener("touchstart",jump);
jumpBtn.addEventListener("mousedown",jump);

function jump(){
  if(player.onGround){
    player.jumpVel=-15;
    player.onGround=false;
  }
}

/* ===== BANGUNAN ===== */
let colors=["#FF5733","#33C1FF","#8D33FF","#33FF57","#FFC300","#FF33A8"];
let buildings=[];
for(let i=0;i<60;i++){
  buildings.push({
    x:(Math.random()-0.5)*2000,
    y:(Math.random()-0.5)*2000,
    color:colors[Math.floor(Math.random()*colors.length)]
  });
}

/* ===== UPDATE ===== */
let keys={};
window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function update(){
  // kamera putar
  if(keys["a"]) camera.angle -=0.04;
  if(keys["d"]) camera.angle +=0.04;

  // maju mundur player sesuai kamera
  let move = 0;
  if(keys["w"]) move = 1;
  if(keys["s"]) move = -1;
  move += -joyY;
  player.angle = camera.angle;
  player.x += Math.sin(camera.angle)*move*player.speed*100;
  player.y += Math.cos(camera.angle)*move*player.speed*100;

  // lompat
  if(!player.onGround){
    player.y += player.jumpVel;
    player.jumpVel += 0.8; // gravity
    if(player.y >= 0){ // tanah
      player.y=0;
      player.onGround=true;
      player.jumpVel=0;
    }
  }
}

/* ===== DRAW ===== */
function draw(){
  ctx.fillStyle="#87CEEB";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ground
  ctx.fillStyle="#228B22";
  ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);

  // kamera transform
  ctx.save();
  ctx.translate(canvas.width/2,canvas.height/2);

  buildings.forEach(b=>{
    let dx=b.x-player.x;
    let dy=b.y-player.y;

    let rx=dx*Math.cos(-camera.angle)-dy*Math.sin(-camera.angle);
    let ry=dx*Math.sin(-camera.angle)+dy*Math.cos(-camera.angle);

    if(ry>1){
      let scale=100/ry;
      let size=45*scale;
      ctx.fillStyle=b.color;
      ctx.fillRect(rx*scale-size/2,-size,size,size);
    }
  });

  ctx.restore();

  // player kotak
  let px=canvas.width/2;
  let py=canvas.height/2;
  ctx.fillStyle="black";
  ctx.fillRect(px-10,py+10,8,20);
  ctx.fillRect(px+2,py+10,8,20);

  ctx.fillStyle="blue";
  ctx.fillRect(px-15,py-10,30,25);

  ctx.fillStyle="yellow";
  ctx.fillRect(px-12,py-30,24,20);

  ctx.fillStyle="black";
  ctx.textAlign="center";
  ctx.fillText(playerName,px,py-40);
}

/* ===== LOOP ===== */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
