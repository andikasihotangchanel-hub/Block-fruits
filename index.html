<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Parkour 3 Dunia</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }

.circle {
  width:60px; height:60px;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  position:fixed;
  bottom:20px;
}

#left { left:20px; }
#right { left:100px; }

#jump {
  right:40px;
  bottom:30px;
  position:fixed;
  width:70px; height:70px;
  border-radius:50%;
  background:white;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="left" class="circle"></div>
<div id="right" class="circle"></div>
<div id="jump"></div>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

  let banned = false;
let banEndTime = localStorage.getItem("banTime");

if(banEndTime){
  banEndTime = Number(banEndTime);

  if(Date.now() < banEndTime){
    banned = true;
  }else{
    // 🔥 BAN SUDAH HABIS → HAPUS
    localStorage.removeItem("banTime");
    banned = false;
  }
}

// Player
let p = {x:50,y:300,w:30,h:30,vx:0,vy:0,onGround:false};

// Nyawa
let maxHP = 3;
let hp = 3;

if(savedBan){
  banEndTime = parseInt(savedBan);
  if(Date.now() < banEndTime){
    banned = true;
  } else {
    
  }
}

      function triggerBan(){
  let banEnd = Date.now() + (24 * 60 * 60 * 1000); // 24 jam

  localStorage.setItem("banTime", banEnd);

  banned = true;
  banEndTime = banEnd;
      }

  let lastX = p.x;
let regenCount = 0;
let lastRegenTime = 0;

let enemyIdleTime = 0;
let lastEnemyX = 0;

// Enemy
let enemy = {x:700,y:200,w:30,h:30,active:false,vy:0};

// REGEN (FIX)
let regen = {x:0,y:0,w:120,h:20,active:false};
let healing = false;
let healStart = 0;

let enemySpawned = false;
let showText = false;
let textTimer = 0;

const spawn = {x:50,y:300};
let gravity = 0.5;

// Platform
let plat = [
  {x:0,y:450,w:800,h:80},

  {x:200,y:380,w:120,h:20},
  {x:350,y:350,w:120,h:20},
  {x:500,y:320,w:120,h:20},
  {x:650,y:300,w:120,h:20},

  {x:800,y:0,w:10,h:600},

  {x:850,y:330,w:120,h:20},
  {x:1000,y:300,w:120,h:20},
  {x:1150,y:270,w:120,h:20},
  {x:1300,y:240,w:120,h:20},

  {x:1500,y:0,w:10,h:600},

  {x:1550,y:300,w:120,h:20},
  {x:1700,y:260,w:120,h:20},
  {x:1850,y:220,w:120,h:20},
  {x:2000,y:180,w:120,h:20},

  {x:2200,y:150,w:150,h:150,finish:true}
];

// Kontrol
let left=false,right=false;

leftBtn = document.getElementById("left");
rightBtn = document.getElementById("right");
jumpBtn = document.getElementById("jump");

leftBtn.ontouchstart=()=>left=true;
leftBtn.ontouchend=()=>left=false;

rightBtn.ontouchstart=()=>right=true;
rightBtn.ontouchend=()=>right=false;

jumpBtn.ontouchstart=()=>{
  if(p.onGround){
    p.vy=-10;
    p.onGround=false;
  }
};

// Stage
function stage(){
  if(p.x < 800){ gravity=0.5; return 1; }
  else if(p.x < 1500){ gravity=0.2; return 2; }
  else{ gravity=0.05; return 3; }
}

function update(){
  let s = stage();

  if(banned){
  // tampilan BAN
  return;
  }

  if(hp > maxHP){
  triggerBan();
  }

  if(showText && Date.now() - textTimer > 10000){
    showText = false;
  }

  // ===== SPAWN REGEN (SATU SAJA) =====
  if(!regen.active){
    if(Math.random() < 0.002){
      regen.active = true;
      regen.x = p.x + 100 + Math.random()*300;

      if(s==1) regen.y = 320;
      else if(s==2) regen.y = 260;
      else regen.y = 200;
    }
  }

  // GERAK
  if(left) p.vx=-5;
  else if(right) p.vx=5;
  else p.vx=0;

  p.vy += gravity;
  p.x += p.vx;
  p.y += p.vy;

  let distance = Math.abs(p.x - lastX);

if(distance > 300 && !p.onGround){
  triggerBan(); // teleport terlalu jauh
}

lastX = p.x;

  p.onGround=false;

  //==== COLLISON REGEN ====
  if(regen.active){
  if(
    p.x < regen.x + regen.w &&
    p.x + p.w > regen.x &&
    p.y < regen.y + regen.h &&
    p.y + p.h > regen.y
  ){
    if(p.vy > 0){
      p.y = regen.y - p.h;
      p.vy = 0;
      p.onGround = true;

      if(hp < maxHP && !healing){
        healing = true;
        healStart = Date.now();
      }
    }
  }
  }

  // COLLISION PLATFORM
  for(let i of plat){
    if(
      p.x < i.x+i.w &&
      p.x+p.w > i.x &&
      p.y < i.y+i.h &&
      p.y+p.h > i.y
    ){
      if(p.vy>0){
        p.y=i.y-p.h;
        p.vy=0;
        p.onGround=true;
      }

      if(i.finish){
        alert("FINISH!");
        reset();
      }
    }
  }

  // ===== COLLISION REGEN (SATU SAJA) =====
  if(regen.active){
    if(
      p.x < regen.x + regen.w &&
      p.x + p.w > regen.x &&
      p.y < regen.y + regen.h &&
      p.y + p.h > regen.y
    ){
      if(p.vy > 0){
        p.y = regen.y - p.h;
        p.vy = 0;
        p.onGround = true;

        if(hp < maxHP && !healing){
          healing = true;
          healStart = Date.now();
        }
      }
    }
  }

  // HEAL
  if(healing){
  if(Date.now() - healStart > 1000){

    regenCount++;

    if(Date.now() - lastRegenTime < 2000){
  regenCount++;
}else{
  regenCount = 1;
}

if(regenCount > 6){
  triggerBan();
}

lastRegenTime = Date.now();

    hp = maxHP;
    healing = false;
    regen.active = false;
  }
  }

  // MUSUH
  if(s==2 && !enemySpawned){
    enemy.active=true;
    enemySpawned=true;
    showText=true;
    textTimer=Date.now();
  }

  // ===== AI MUSUH =====
if(enemy.active){

  let dx = p.x - enemy.x;

  let speed = 2;

  if(Math.abs(dx) < 200) speed = 3;
  if(Math.abs(dx) < 100) speed = 3;

  if(hp == 1){
  if(dx > 0) enemy.x += 6;
  else enemy.x -= 6;
  }

  if(Math.abs(dx) > 5){
  if(dx > 0) enemy.x += speed;
  else enemy.x -= speed;
  }

  // gravitasi
  enemy.vy += 0.5;
  enemy.y += enemy.vy;

  // collision platform
  enemy.onGround = false;
  for(let i of plat){
    if(
      enemy.x < i.x+i.w &&
      enemy.x+enemy.w > i.x &&
      enemy.y < i.y+i.h &&
      enemy.y+enemy.h > i.y
    ){
      if(enemy.vy > 0){
        enemy.y = i.y - enemy.h;
        enemy.vy = 0;
        enemy.onGround = true;
      }
    }
  }
}

  // ===== KENA MUSUH =====
if(enemy.active){
  if(
    p.x < enemy.x + enemy.w &&
    p.x + p.w > enemy.x &&
    p.y < enemy.y + enemy.h &&
    p.y + p.h > enemy.y
  ){
    hp -= 1;

    enemy.active = false;

    setTimeout(()=>{
      enemy.active = true;
    },1000);

    reset();

    if(hp <= 0){
      alert("GAME OVER");
      location.reload();
    }
  }
}

  if(p.y > c.height){
    reset();
  }
}

function reset(){
  p.x=spawn.x;
  p.y=spawn.y;
  p.vy=0;
}

function draw(){

if(banned){

  ctx.fillStyle = "black";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle = "red";
  ctx.font = "bold 50px Arial";
  ctx.textAlign = "center";
  ctx.fillText("BANED", c.width/2, 150);

  let sisa = Math.max(0, banEndTime - Date.now());

  let jam = Math.floor(sisa / 3600000);
  let menit = Math.floor((sisa % 3600000) / 60000);
  let detik = Math.floor((sisa % 60000) / 1000);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";

  ctx.fillText(
    "kamu melanggar ketentuan game",
    c.width/2, 220
  );

  ctx.fillText(
    "reset dalam: " + jam + ":" + menit + ":" + detik,
    c.width/2, 260
  );

  ctx.font = "12px Arial";
  ctx.fillText(
    "oleh admin game",
    c.width/2, 300
  );

  return;
}
  
  let s = stage();

  ctx.fillStyle = s==1?"skyblue":s==2?"#400000":"black";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.save();
  ctx.translate(-p.x+100,0);

  for(let i of plat){
    ctx.fillStyle = i.finish?"yellow":i.w==10?"lime":"green";
    ctx.fillRect(i.x,i.y,i.w,i.h);
  }

  if(regen.active){
    ctx.fillStyle="#00FFFF";
    ctx.fillRect(regen.x,regen.y,regen.w,regen.h);
  }

  if(enemy.active){
    ctx.fillStyle="red";
    ctx.fillRect(enemy.x,enemy.y,enemy.w,enemy.h);
  }

  ctx.fillStyle="white";
  ctx.fillRect(p.x,p.y,p.w,p.h);

  ctx.restore();

  // ===== UI NYAWA =====
  for(let i=0;i<maxHP;i++){
    ctx.strokeStyle="white";
    ctx.strokeRect(c.width-50-(i*35),20,25,25);

    ctx.fillStyle = i<hp ? "blue" : "black";
    ctx.fillRect(c.width-50-(i*35),20,25,25);
  }

  ctx.fillStyle="white";
  ctx.fillText("HP:"+hp,20,30);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
