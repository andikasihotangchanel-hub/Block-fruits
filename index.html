<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota Final</title>
<style>
body{margin:0;overflow:hidden;background:skyblue;font-family:Arial}
canvas{display:block}

#nameScreen{
position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:flex;justify-content:center;align-items:center;
flex-direction:column;color:white;z-index:10;
}
#nameScreen input{padding:10px;font-size:18px;margin:10px}
#nameScreen button{padding:10px 20px;font-size:18px}

#joystick{
position:fixed;bottom:30px;left:30px;
width:110px;height:110px;
background:rgba(0,0,0,0.3);
border-radius:50%;touch-action:none;
}
#stick{
position:absolute;width:50px;height:50px;
background:white;border-radius:50%;
left:30px;top:30px;
}
</style>
</head>
<body>

<div id="nameScreen">
<h2>Masukkan Nama</h2>
<input type="text" id="nameInput">
<button onclick="startGame()">Mulai</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let playerName="Player";
function startGame(){
let n=document.getElementById("nameInput").value;
if(n.trim()!="") playerName=n;
document.getElementById("nameScreen").style.display="none";
}

/* PLAYER */
let player={
x:1000,
y:800,
w:40,
h:60,
speed:3,
angle:0   // arah hadap (radian)
};

let camera={x:0,y:0};
let world="outside";

/* KEYBOARD */
let keys={};
window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

/* JOYSTICK */
let joyX=0,joyY=0,active=false;
let joy=document.getElementById("joystick");
let stick=document.getElementById("stick");

joy.addEventListener("touchstart",()=>active=true);
joy.addEventListener("touchend",()=>{
active=false;joyX=0;joyY=0;
stick.style.left="30px";
stick.style.top="30px";
});
joy.addEventListener("touchmove",e=>{
if(!active)return;
let r=joy.getBoundingClientRect();
let t=e.touches[0];
let x=t.clientX-r.left-55;
let y=t.clientY-r.top-55;
let d=Math.sqrt(x*x+y*y);
if(d>45){x*=45/d;y*=45/d;}
joyX=x/45;joyY=y/45;
stick.style.left=(30+x)+"px";
stick.style.top=(30+y)+"px";
});

/* MAP */
let houses=[
{x:900,y:700,w:200,h:180}
];

let buildings=[];
for(let i=0;i<40;i++){
buildings.push({
x:Math.random()*3000,
y:Math.random()*2000,
w:120+Math.random()*80,
h:120+Math.random()*80
});
}

/* COLLISION */
function collide(a,b){
return a.x < b.x+b.w &&
a.x+a.w > b.x &&
a.y < b.y+b.h &&
a.y+a.h > b.y;
}

/* UPDATE */
function update(){

/* PUTAR KIRI KANAN */
if(keys["ArrowLeft"]||keys["a"]) player.angle -= 0.05;
if(keys["ArrowRight"]||keys["d"]) player.angle += 0.05;

/* MAJU MUNDUR */
let moveForward=0;

if(keys["ArrowUp"]||keys["w"]) moveForward=1;
if(keys["ArrowDown"]||keys["s"]) moveForward=-1;

/* joystick */
if(active){
player.angle += joyX*0.05;
moveForward = -joyY;
}

/* gerak berdasarkan arah hadap */
player.x += Math.sin(player.angle)*player.speed*moveForward;
player.y -= Math.cos(player.angle)*player.speed*moveForward;

/* MASUK RUMAH */
if(world=="outside"){
houses.forEach(h=>{
if(collide(player,h)){
world="inside";
player.x=400;
player.y=400;
}
});
}

/* KELUAR RUMAH */
if(world=="inside"){
if(player.x<0){
world="outside";
player.x=850;
player.y=650;
}
}

camera.x=player.x-canvas.width/2;
camera.y=player.y-canvas.height/2;
}

/* DRAW PLAYER */
function drawPlayer(){
ctx.save();
ctx.translate(player.x+player.w/2,player.y+player.h/2);
ctx.rotate(player.angle);

ctx.fillStyle="red";
ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);

/* tanda depan */
ctx.fillStyle="black";
ctx.fillRect(-5,-player.h/2-10,10,10);

ctx.restore();

/* nama */
ctx.fillStyle="black";
ctx.textAlign="center";
ctx.fillText(playerName,player.x+player.w/2,player.y-15);
}

/* DRAW */
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.save();
ctx.translate(-camera.x,-camera.y);

if(world=="outside"){

ctx.fillStyle="#777";
ctx.fillRect(-2000,600,6000,200);

buildings.forEach(b=>{
ctx.fillStyle="#555";
ctx.fillRect(b.x,b.y,b.w,b.h);
});

houses.forEach(h=>{
ctx.fillStyle="brown";
ctx.fillRect(h.x,h.y,h.w,h.h);
});

}

if(world=="inside"){
ctx.fillStyle="#ddd";
ctx.fillRect(0,0,2000,2000);
ctx.fillStyle="#aaa";
ctx.fillRect(200,200,500,300);
}

drawPlayer();

ctx.restore();
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
