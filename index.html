<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game HAPPY UPDATE</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
}
canvas{
    display:block;
}
button{
    position:fixed;
    width:70px;
    height:70px;
    border-radius:50%;
    border:none;
    font-size:20px;
    color:white;
}
#leftBtn{ left:30px; bottom:80px; background:blue; }
#rightBtn{ left:120px; bottom:80px; background:blue; }
#jumpBtn{ right:40px; bottom:80px; background:red; }
#nameScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}
#nameScreen input{
    padding:10px;
    font-size:18px;
}
#nameScreen button{
    position:static;
    margin-top:15px;
    border-radius:10px;
    width:120px;
    height:40px;
}
</style>
</head>
<body>

<div id="nameScreen">
    <h2>Masukkan Nama</h2>
    <input id="nameInput" placeholder="Nama kamu">
    <button onclick="startGame()">Mulai</button>
</div>

<canvas id="game"></canvas>

<button id="leftBtn">◀</button>
<button id="rightBtn">▶</button>
<button id="jumpBtn">JUMP</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let playerName = "PLAYER";

// ===== EVENT BULAN MARET =====
const currentMonth = new Date().getMonth();
const isHappyUpdate = (currentMonth === 2); 
// untuk test paksa aktif:
// const isHappyUpdate = true;

let player = {
    x: canvas.width/2,
    y: 0,
    width: 40,
    height: 80,
    velocityY:0,
    jumping:false
};

function startGame(){
    let n = document.getElementById("nameInput").value;
    if(n.trim()!="") playerName = n;

    document.getElementById("nameScreen").style.display="none";

    if(isHappyUpdate){
        const audio = new Audio("https://www.soundjay.com/human/sounds/happy-birthday-song-01.mp3");
        audio.play().catch(()=>{});
    }
}

// ===== CONTROL HP =====
document.getElementById("leftBtn").addEventListener("touchstart",()=>{ player.x -= 20; });
document.getElementById("rightBtn").addEventListener("touchstart",()=>{ player.x += 20; });

document.getElementById("jumpBtn").addEventListener("touchstart",()=>{
    if(!player.jumping){
        player.velocityY = -12;
        player.jumping = true;
    }
});

// ===== CONTROL KEYBOARD =====
let keys={};
window.addEventListener("keydown",e=>{ keys[e.key]=true; });
window.addEventListener("keyup",e=>{ keys[e.key]=false; });

function update(){

    if(keys["ArrowLeft"]) player.x -=5;
    if(keys["ArrowRight"]) player.x +=5;

    if(player.jumping){
        player.y += player.velocityY;
        player.velocityY += 0.6;
        if(player.y>=0){
            player.y=0;
            player.jumping=false;
        }
    }
}

function draw(){

    if(isHappyUpdate){

        // MALAM
        ctx.fillStyle="#0a0f1f";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // TANAH
        ctx.fillStyle="#1e7a1e";
        ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);

        let centerX = canvas.width/2;
        let groundY = canvas.height/2;

        // ===== NAMA DI LANGIT =====
        ctx.fillStyle="gold";
ctx.font="60px Arial";
ctx.textAlign="center";
ctx.fillText("SELAMAT ULANG TAHUN", centerX, 110);

ctx.font="70px Arial";
ctx.fillText("ANDIKA", centerX, 170);

ctx.font="35px Arial";
ctx.fillText("HAPPY UPDATE", centerX, 220);

        // ===== 3 TIANG =====
        ctx.fillStyle="white";

        ctx.fillRect(centerX-200, groundY-200, 40, 200);
        ctx.fillRect(centerX-20, groundY-200, 40, 200);
        ctx.fillRect(centerX+160, groundY-200, 40, 200);

        ctx.fillStyle="yellow";
        ctx.font="28px Arial";

        ctx.fillText("HAPPY", centerX-180, groundY-220);
        ctx.fillText("UPDATE", centerX, groundY-220);
        ctx.fillText("🎉", centerX+180, groundY-220);

        // ===== KUE =====
        ctx.fillStyle="#8B4513";
        ctx.fillRect(centerX-100, groundY+20, 200, 70);

        ctx.fillStyle="pink";
        ctx.fillRect(centerX-100, groundY, 200, 30);

        for(let i=0;i<5;i++){
            ctx.fillStyle="white";
            ctx.fillRect(centerX-60+i*30, groundY-20, 5, 20);

            ctx.fillStyle="orange";
            ctx.beginPath();
            ctx.arc(centerX-58+i*30, groundY-25,5,0,Math.PI*2);
            ctx.fill();
        }

    } else {

        // MODE NORMAL (kota sederhana)
        ctx.fillStyle="skyblue";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="green";
        ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);

        ctx.fillStyle="gray";
        ctx.fillRect(100,canvas.height/2-200,100,200);
        ctx.fillRect(250,canvas.height/2-150,120,150);
        ctx.fillRect(420,canvas.height/2-180,90,180);
    }

    // ===== PLAYER =====
    let ground = canvas.height/2;

    ctx.fillStyle="yellow"; // kepala
    ctx.fillRect(player.x, ground-80+player.y, 40, 30);

    ctx.fillStyle="blue"; // badan
    ctx.fillRect(player.x, ground-50+player.y, 40, 40);

    ctx.fillStyle="black"; // kaki
    ctx.fillRect(player.x+5, ground-10+player.y, 10, 10);
    ctx.fillRect(player.x+25, ground-10+player.y, 10, 10);
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
