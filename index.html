<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota + HAPPY UPDATE</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
}
canvas{display:block;}

#nameScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    z-index:10;
}
#nameScreen input{
    padding:10px;
    font-size:18px;
    margin:10px;
}
#nameScreen button{
    padding:10px 20px;
    font-size:18px;
}

#jumpBtn{
    position:fixed;
    right:30px;
    bottom:80px;
    width:80px;
    height:80px;
    border-radius:50%;
    background:red;
    color:white;
    font-weight:bold;
    border:none;
    font-size:18px;
}
</style>
</head>

<body>

<div id="nameScreen">
    <h2>Masukkan Nama</h2>
    <input type="text" id="nameInput">
    <button onclick="startGame()">Mulai</button>
</div>

<canvas id="game"></canvas>
<button id="jumpBtn">JUMP</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let playerName = "Player";

function startGame(){
    let n = document.getElementById("nameInput").value;
    if(n.trim()!="") playerName = n;
    document.getElementById("nameScreen").style.display="none";

    if(isHappyUpdate){
        let audio = new Audio("https://www.soundjay.com/human/sounds/happy-birthday-song-01.mp3");
        audio.play();
    }
}

/* ===== EVENT SYSTEM ===== */
const currentMonth = new Date().getMonth();
const isHappyUpdate = (currentMonth === 2); // Maret

/* ===== PLAYER ===== */
let player={
    x:0,
    y:0,
    jumpVelocity:0,
    isJumping:false
};

document.getElementById("jumpBtn").addEventListener("click",jump);
function jump(){
    if(!player.isJumping){
        player.jumpVelocity = -12;
        player.isJumping=true;
    }
}

/* ===== BUILDINGS NORMAL ===== */
let buildings=[];
for(let i=0;i<40;i++){
    buildings.push({
        x:Math.random()*2000-1000,
        y:Math.random()*500+200,
        w:50,
        h:100+Math.random()*100
    });
}

/* ===== UPDATE ===== */
function update(){

    if(player.isJumping){
        player.y += player.jumpVelocity;
        player.jumpVelocity += 0.6;
        if(player.y>=0){
            player.y=0;
            player.isJumping=false;
        }
    }
}

/* ===== DRAW ===== */
function draw(){

    if(isHappyUpdate){
        // MALAM
        ctx.fillStyle="#0b0f2a";
    }else{
        ctx.fillStyle="#87CEEB";
    }
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(isHappyUpdate){

        // ===== NAMA BESAR DI LANGIT =====
        ctx.fillStyle="gold";
        ctx.font="80px Arial";
        ctx.textAlign="center";
        ctx.fillText(playerName, canvas.width/2, 120);

        ctx.font="50px Arial";
        ctx.fillText("HAPPY UPDATE", canvas.width/2, 200);

        // ===== 3 TIANG =====
        ctx.fillStyle="white";
        ctx.fillRect(canvas.width/2-250,canvas.height/2-150,40,200);
        ctx.fillRect(canvas.width/2-20,canvas.height/2-150,40,200);
        ctx.fillRect(canvas.width/2+210,canvas.height/2-150,40,200);

        ctx.fillStyle="yellow";
        ctx.font="30px Arial";
        ctx.fillText("HAPPY", canvas.width/2-230, canvas.height/2-170);
        ctx.fillText("UPDATE", canvas.width/2, canvas.height/2-170);
        ctx.fillText("🎉", canvas.width/2+230, canvas.height/2-170);

        // ===== KUE ULANG TAHUN =====
        ctx.fillStyle="#8B4513";
        ctx.fillRect(canvas.width/2-100, canvas.height/2+50, 200, 80);

        ctx.fillStyle="pink";
        ctx.fillRect(canvas.width/2-100, canvas.height/2+30, 200, 30);

        // Lilin
        for(let i=0;i<5;i++){
            ctx.fillStyle="white";
            ctx.fillRect(canvas.width/2-60+i*30, canvas.height/2+10, 5, 20);
            ctx.fillStyle="orange";
            ctx.beginPath();
            ctx.arc(canvas.width/2-58+i*30, canvas.height/2+5,5,0,Math.PI*2);
            ctx.fill();
        }

    }else{

        // GAME NORMAL
        ctx.fillStyle="#228B22";
        ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);

        buildings.forEach(b=>{
            ctx.fillStyle="gray";
            ctx.fillRect(
                b.x+canvas.width/2,
                canvas.height/2-b.h,
                b.w,
                b.h
            );
        });

    }

    // ===== PLAYER =====
    let px = canvas.width/2;
    let py = canvas.height/2 + player.y;

    ctx.fillStyle="black";
    ctx.fillRect(px-10,py,8,20);
    ctx.fillRect(px+2,py,8,20);

    ctx.fillStyle="blue";
    ctx.fillRect(px-15,py-10,30,25);

    ctx.fillStyle="yellow";
    ctx.fillRect(px-12,py-30,24,20);
}

/* LOOP */
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
