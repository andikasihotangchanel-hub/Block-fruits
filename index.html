<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Kota Smooth</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;font-family:Arial}
canvas{display:block}

#nameScreen{
position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:flex;justify-content:center;align-items:center;
flex-direction:column;color:white;z-index:10;
}
#nameScreen input{padding:10px;font-size:18px;margin:10px}
#nameScreen button{padding:10px 20px;font-size:18px}

#joystick{
position:fixed;bottom:30px;left:30px;
width:110px;height:110px;
background:rgba(0,0,0,0.3);
border-radius:50%;touch-action:none;
}
#stick{
position:absolute;width:50px;height:50px;
background:white;border-radius:50%;
left:30px;top:30px;
}
</style>
</head>
<body>

<div id="nameScreen">
<h2>Masukkan Nama</h2>
<input type="text" id="nameInput">
<button onclick="startGame()">Mulai</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let playerName="Player";
function startGame(){
let n=document.getElementById("nameInput").value;
if(n.trim()!="") playerName=n;
document.getElementById("nameScreen").style.display="none";
}

/* PLAYER */
let player={
x:0,
y:0,
angle:0,
speed:0.08,      // lebih pelan
turnSpeed:0.03   // belok halus
};

/* JOYSTICK */
let joyX=0,joyY=0,active=false;
let joy=document.getElementById("joystick");
let stick=document.getElementById("stick");

joy.addEventListener("touchstart",()=>active=true);
joy.addEventListener("touchend",()=>{
active=false;joyX=0;joyY=0;
stick.style.left="30px";
stick.style.top="30px";
});
joy.addEventListener("touchmove",e=>{
if(!active)return;
let r=joy.getBoundingClientRect();
let t=e.touches[0];
let x=t.clientX-r.left-55;
let y=t.clientY-r.top-55;
let d=Math.sqrt(x*x+y*y);
if(d>45){x*=45/d;y*=45/d;}
joyX=x/45;
joyY=y/45;
stick.style.left=(30+x)+"px";
stick.style.top=(30+y)+"px";
});

/* BANGUNAN */
let houses=[];
for(let i=0;i<40;i++){
houses.push({
x:(Math.random()-0.5)*120,
y:Math.random()*200+20
});
}

/* UPDATE */
function update(){

/* belok smooth */
player.angle += joyX * player.turnSpeed;

/* maju mundur */
let move = -joyY * player.speed;

player.x += Math.sin(player.angle) * move;
player.y += Math.cos(player.angle) * move;
}

/* DRAW */
function draw(){

ctx.fillStyle="#87CEEB";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#228B22";
ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);

ctx.save();
ctx.translate(canvas.width/2,canvas.height/2);

/* render bangunan */
houses.forEach(h=>{
let dx=h.x-player.x;
let dy=h.y-player.y;

/* kamera ikut angle player */
let rx=dx*Math.cos(-player.angle)-dy*Math.sin(-player.angle);
let ry=dx*Math.sin(-player.angle)+dy*Math.cos(-player.angle);

if(ry>1){
let scale=180/ry;  // zoom lebih dekat
let size=80*scale;

ctx.fillStyle="#8B0000";
ctx.fillRect(rx*scale-size/2,-size,size,size);
}
});

ctx.restore();

/* PLAYER tetap tengah */
ctx.fillStyle="red";
ctx.fillRect(canvas.width/2-20,canvas.height/2-40,40,60);

/* nama */
ctx.fillStyle="black";
ctx.textAlign="center";
ctx.fillText(playerName,canvas.width/2,canvas.height/2-50);
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
