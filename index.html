<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Blocks v0.3</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}

canvas{
display:block;
}

/* joystick */

#joystick{
position:fixed;
bottom:30px;
left:30px;
width:120px;
height:120px;
background:rgba(255,255,255,0.1);
border-radius:50%;
}

#stick{
position:absolute;
width:60px;
height:60px;
background:white;
border-radius:50%;
left:30px;
top:30px;
}

/* jump */

#jumpBtn{
position:fixed;
right:30px;
bottom:80px;
width:80px;
height:80px;
border-radius:50%;
background:red;
color:white;
border:none;
font-size:18px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="jumpBtn">JUMP</button>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

function resize(){
canvas.width=window.innerWidth
canvas.height=window.innerHeight
}
resize()
window.addEventListener("resize",resize)

/* player */

let player={
x:0,
y:0,
speed:4
}

/* joystick */

let joyX=0
let joyY=0

let joy=document.getElementById("joystick")
let stick=document.getElementById("stick")

joy.addEventListener("touchmove",e=>{

let rect=joy.getBoundingClientRect()

let x=e.touches[0].clientX-rect.left-60
let y=e.touches[0].clientY-rect.top-60

joyX=x/40
joyY=y/40

stick.style.left=(x+30)+"px"
stick.style.top=(y+30)+"px"

})

joy.addEventListener("touchend",()=>{

joyX=0
joyY=0

stick.style.left="30px"
stick.style.top="30px"

})

/* jump */

let jump=0
let velocity=0
let gravity=0.6
let jumping=false

document.getElementById("jumpBtn").onclick=()=>{

if(!jumping){
velocity=-12
jumping=true
}

}

/* game loop */

function update(){

player.x+=joyX
player.y+=joyY

velocity+=gravity
jump+=velocity

if(jump>0){
jump=0
velocity=0
jumping=false
}

}

function draw(){

/* sky */

ctx.fillStyle="#050520"
ctx.fillRect(0,0,canvas.width,canvas.height)

/* ground */

ctx.fillStyle="#333"
ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height)

/* road */

ctx.fillStyle="#222"
ctx.fillRect(0,canvas.height/2+80,canvas.width,120)

/* buildings */

for(let i=-10;i<10;i++){

ctx.fillStyle="#666"

ctx.fillRect(
canvas.width/2+i*200-player.x,
canvas.height/2-200+jump,
120,
200
)

}

/* trees */

for(let i=-10;i<10;i++){

ctx.fillStyle="green"

ctx.fillRect(
canvas.width/2+i*180-player.x,
canvas.height/2-40+jump,
40,
40
)

}

/* player */

ctx.fillStyle="white"

ctx.fillRect(
canvas.width/2-15,
canvas.height/2-30+jump,
30,
30
)

}

function loop(){

update()
draw()

requestAnimationFrame(loop)

}

loop()

</script>

</body>
</html>
