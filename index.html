<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HAPPY UPDATE</title>
<style>
body { margin:0; overflow:hidden; background:black; }
#joystick {
position:fixed;
bottom:40px;
left:40px;
width:120px;
height:120px;
background:rgba(255,255,255,0.1);
border-radius:50%;
touch-action:none;
}
#stick {
position:absolute;
width:60px;
height:60px;
background:white;
border-radius:50%;
top:30px;
left:30px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<audio id="bgMusic" loop>
  <source src="ultah.mp3" type="audio/mpeg">
</audio>

<div id="joystick"><div id="stick"></div></div>

<script>
// ====== MARCH CHECK ======
const month = new Date().getMonth();
if(month !== 2){
alert("Event hanya tersedia bulan Maret 🎂");
}

// ====== CANVAS ======
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// ====== MUSIC ======
let musicStarted=false;
const bgMusic=document.getElementById("bgMusic");
document.addEventListener("touchstart",()=>{
if(!musicStarted){
bgMusic.volume=0.8;
bgMusic.play().catch(()=>{});
musicStarted=true;
}
});

// ====== PLAYER ======
let player={
x:0,y:0,z:0,
vy:0,
size:40,
speed:0.6
};

let camera={x:0,y:60,z:200,rotY:0};

let keys={};

// ====== JOYSTICK ======
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joyActive=false,joyX=0,joyY=0;

joystick.addEventListener("touchstart",e=>{
joyActive=true;
});

joystick.addEventListener("touchmove",e=>{
let rect=joystick.getBoundingClientRect();
let touch=e.touches[0];
joyX=touch.clientX-(rect.left+60);
joyY=touch.clientY-(rect.top+60);
let dist=Math.sqrt(joyX*joyX+joyY*joyY);
if(dist>40){
joyX*=40/dist;
joyY*=40/dist;
}
stick.style.left=(joyX+30)+"px";
stick.style.top=(joyY+30)+"px";
});

joystick.addEventListener("touchend",()=>{
joyActive=false;
joyX=0;joyY=0;
stick.style.left="30px";
stick.style.top="30px";
});

// ====== JUMP ======
document.addEventListener("touchstart",e=>{
if(e.target.id!=="stick"){
if(player.y===0){
player.vy=8;
}
}
});

function update(){

// movement
if(joyActive){
player.x+=joyX*0.05;
player.z+=joyY*0.05;
}

// gravity
player.vy-=0.4;
player.y+=player.vy;
if(player.y<0){
player.y=0;
player.vy=0;
}

// camera follow
camera.x=player.x;
camera.z=player.z+200;
}

// ====== DRAW ======
function draw(){
ctx.fillStyle="black";
ctx.fillRect(0,0,canvas.width,canvas.height);

// sky text
ctx.fillStyle="white";
ctx.font="40px Arial";
ctx.textAlign="center";
ctx.fillText("selamat ulang tahun andika",
canvas.width/2,100);

// ground
ctx.fillStyle="#111";
ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);

// player
ctx.fillStyle="white";
ctx.fillRect(
canvas.width/2-20,
canvas.height/2-player.y-40,
40,40
);

// 3 pillars
for(let i=-1;i<=1;i++){
ctx.fillStyle="gray";
ctx.fillRect(
canvas.width/2+i*150-25,
canvas.height/2-150,
50,150
);
ctx.fillStyle="white";
ctx.fillText("HAPPY UPDATE",
canvas.width/2+i*150,
canvas.height/2-160);
}

// cake
ctx.fillStyle="pink";
ctx.fillRect(canvas.width/2-60,canvas.height/2-60,120,30);
ctx.fillStyle="yellow";
ctx.fillRect(canvas.width/2-5,canvas.height/2-90,10,30);
}

// ====== LOOP ======
function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
