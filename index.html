<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Parkour 4 Dunia</title>
<style>
body {
  margin: 0;
  overflow: hidden;
}

canvas {
  display: block;
  background: black; /* 🔥 penting biar gak putih */
  width: 100vw;
  height: 100vh;
}

.circle {
  width:60px; height:60px;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  position:fixed;
  bottom:20px;
}

#joyBase {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
}

#joyStick {
  position: fixed;
  bottom: 50px;
  left: 50px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,0.7);
}
  
#left { left:20px; }
#right { left:100px; }

#jump {
  right:40px;
  bottom:30px;
  position:fixed;
  width:70px; height:70px;
  border-radius:50%;
  background:white;
}

.circle, #jump {
  touch-action: none;
  user-select: none;
}
  
</style>
</head>
<body>

  <div id="joyBase"></div>
<div id="joyStick"></div>

<canvas id="c"></canvas>

<video id="endingVideo" style="
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
display:none;
z-index:999;
object-fit:cover;
" src="lv_0_20260423185502.mp4"></video>

  <div id="tamatText" style="
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
display:none;
z-index:1000;
background:black;
color:white;
font-size:60px;
font-weight:bold;
justify-content:center;
align-items:center;
">
TAMAT
  </div>
  
<div id="jump"></div>

<script>

  window.onerror = function(msg, url, line){
  alert("ERROR: " + msg + " di baris " + line);
  }

  let joystickActive = false;
let joystickX = 0; // -1 sampai 1

// ===== CANVAS =====
const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

// ===== BAN SYSTEM =====

const GAME_VERSION = "1.1"; // ganti tiap update
  
let banned = false;
let banEndTime = Number(localStorage.getItem("banTime"));

if(banEndTime && Date.now() < banEndTime){
  banned = true;
}else{
  localStorage.removeItem("banTime");
}

  let savedVersion = localStorage.getItem("gameVersion");

if(savedVersion !== GAME_VERSION){

  // 🔥 kalau player lagi kena ban → reset jadi 2 menit
  if(banned){
    let resetTime = 2 * 60 * 1000 + 59 * 1000; // 2:59
    let newBan = Date.now() + resetTime;

    localStorage.setItem("banTime", newBan);

    banEndTime = newBan;
  }

  // simpan versi terbaru
  localStorage.setItem("gameVersion", GAME_VERSION);
}

function triggerBan(level="normal"){
  let min=0, max=0;

  if(level=="ringan"){ min=2*60*1000; max=10*60*1000; }
  else if(level=="normal"){ min=10*60*1000; max=2*60*60*1000; }
  else { min=2*60*60*1000; max=24*60*60*1000; }

  let random = Math.random()*(max-min)+min;
  banEndTime = Date.now()+random;

  localStorage.setItem("banTime", banEndTime);
  banned = true;
}

// ===== PLAYER =====
let spawn = {x:50,y:400};
let p = {x:50,y:400,w:30,h:30,vx:0,vy:0,onGround:false};

  let coyoteTime = 0;

let jumpBuffer = 0;
  
let camX = 0;
  
let gravity = 0.5;

  let luckCount = 0;
let lastStage = 1;

let buffs = {
  shield: false,
  speed: false,
  lowGravity: false
};

let debuffs = {
  slow: false,
  heavy: false,
  reverse: false
};

  function startEnding(){
  mode = "ending";

  // stop semua gerakan
  p.vx = 0;
  p.vy = 0;
  enemy.active = false;

  // tampilkan video
  document.getElementById("endingVideo").style.display = "block";

  let vid = document.getElementById("endingVideo");

video.onended = function(){

  // sembunyikan video
  video.style.display = "none";

  // tampilkan layar hitam + TAMAT
  document.getElementById("tamatText").style.display = "flex";

  // reset setelah 3 detik
  setTimeout(()=>{
    location.reload();
  }, 3000);
};
    
  vid.currentTime = 0;
  vid.play();
  }

let buffEnd = 0;
let debuffEnd = 0;

  // ✅ TARUH DI SINI
function triggerLuckEvent(){
  let isGood = Math.random() < 0.5;

  if(isGood){
    let rand = Math.floor(Math.random()*3);

    buffs = {shield:false, speed:false, lowGravity:false};

    if(rand === 0){
      buffs.shield = true;
      addChat("player","LUCKY! Dapat Shield 🛡️");
    }
    else if(rand === 1){
      buffs.speed = true;
      addChat("player","LUCKY! Speed naik ⚡");
    }
    else{
      buffs.lowGravity = true;
      addChat("player","LUCKY! Lompat tinggi 🌙");
    }

    buffEnd = Date.now() + 5000;

  } else {

    let rand = Math.floor(Math.random()*3);

    debuffs = {slow:false, heavy:false, reverse:false};

    if(rand === 0){
      debuffs.slow = true;
      addChat("enemy","SIAL! Kamu melambat 🐢");
    }
    else if(rand === 1){
      debuffs.heavy = true;
      addChat("enemy","SIAL! Gravity berat 💀");
    }
    else{
      debuffs.reverse = true;
      addChat("enemy","SIAL! Kontrol terbalik 🔄");
    }

    debuffEnd = Date.now() + 5000;
  }
}

  let ranks = [
  {name:"Warrior", icon:"🧢"},
  {name:"Master", icon:"🪖"},
  {name:"Grand Master", icon:"⛑️"},
  {name:"Epic", icon:"🎩"},
  {name:"Legend", icon:"💎"},
  {name:"Mythic", icon:"💍"},
  {name:"Immortal", icon:"👑"}
];

let rankIndex = Number(localStorage.getItem("rankIndex")) || 0;
let winPoint = Number(localStorage.getItem("winPoint")) || 0;

function saveRank(){
  localStorage.setItem("rankIndex", rankIndex);
  localStorage.setItem("winPoint", winPoint);
}
  
// ===== HP =====
let maxHP = 3;
let hp = 3;

  let lastDamage = "";

// ===== SAFE TIME (ANTI BAN SALAH) =====
let safeTime = 0;

// ===== TRACK =====
let lastX = p.x;
let regenCount = 0;
let lastRegenTime = 0;

// ===== ENEMY =====
let enemy = {
  x:700,
  y:200,
  w:30,
  h:30,
  active:false,
  vy:0,
  onGround:false,

  hp:3,
  maxHP:3,

  state:"normal", // normal / lemah
  lastSwitch:0,

ai:"idle",
lastThink:0
  
};

  let chats = [];

function addChat(sender, text){
  chats.push({
    sender: sender,
    text: text,
    time: Date.now()
  });
}
    
//==== PARTICLE ====
  let particles = [];

function spawnParticles(x,y){
  try{
    for(let i=0;i<30;i++){
      particles.push({
        x:x,
        y:y,
        vx:(Math.random()-0.5)*4,
        vy:Math.random()*-5,
        life:60
      });
    }
  }catch(e){
    console.log(e);
  }
}

  

// ===== REGEN =====
let regen = {x:0,y:0,w:120,h:20,active:false};
let healing = false;
let healStart = 0;
  
// REGEN MUSUH
  let enemyRegen = {
  x:0,
  y:0,
  w:120,
  h:20,
  active:false
};

let enemyHealing = false;
let enemyHealStart = 0;

// ===== MODE =====
let mode = "main"; // main / ending

  let showTamat = false;

// ===== PLATFORM =====
let plat = [];
  
function generatePlatform(){
  plat = [];

  // lantai awal
  plat.push({x:0,y:450,w:800,h:80});

  let x = 300;

  for(let i=0;i<20;i++){

    // jarak antar AREA (bukan platform)
    x += 200 + Math.random()*200;

    let baseY = 200 + Math.random()*200;

    // tiap area punya 2-4 platform kecil
    let jumlah = 2 + Math.floor(Math.random()*3);

    for(let j=0;j<jumlah;j++){
      plat.push({
        x: x + Math.random()*150,
        y: baseY + (Math.random()*100 - 50),
        w: 80 + Math.random()*60,
        h: 20
      });
    }
  }

  // pembatas dunia
  plat.push({x:800,y:0,w:10,h:600});
  plat.push({x:1500,y:0,w:10,h:600});
  plat.push({x:2200,y:0,w:10,h:600});

  // finish jauh banget
  plat.push({
    x: x + 300,
    y: 200,
    w:150,
    h:150,
    finish:true
  });
}
  
generatePlatform();

const jumpBtn = document.getElementById("jump");

 let video = document.getElementById("endingVideo");

video.onended = function(){
  showTamat = true;

  setTimeout(()=>{
    location.reload(); // reset game
  }, 3000); // tunggu 3 detik biar tulisan TAMAT kelihatan
};
  
// ===== CONTROL =====

function pressJump(e){
  e.preventDefault();

  // buffer lompat biar gak miss
  jumpBuffer = Date.now();
}

// JUMP
jumpBtn.addEventListener("pointerdown", pressJump);

  // ===== DIFFICULTY BY RANK =====

let difficulty = rankIndex;

// contoh efek:
enemy.maxHP = 3 + difficulty;
enemy.hp = Math.min(enemy.hp, enemy.maxHP);

if(difficulty >= 2){
  enemy.speed = 3;
}
if(difficulty >= 4){
  gravity += 0.02;
}

  const joyBase = document.getElementById("joyBase");
const joyStick = document.getElementById("joyStick");

let baseRect;

joyBase.addEventListener("pointerdown", (e)=>{
  joystickActive = true;
  baseRect = joyBase.getBoundingClientRect();
});

window.addEventListener("pointermove", (e)=>{
  if(!joystickActive) return;

  let centerX = baseRect.left + baseRect.width/2;
  let dx = e.clientX - centerX;

  // batas gerakan
  let max = 40;
  dx = Math.max(-max, Math.min(max, dx));

  joystickX = dx / max;

  // gerakin stick UI
  joyStick.style.transform = `translate(${dx}px, 0px)`;
});

window.addEventListener("pointerup", ()=>{
  joystickActive = false;
  joystickX = 0;
  joyStick.style.transform = `translate(0px,0px)`;
});

// ===== STAGE =====
function stage(){
  if(p.x < 800){ gravity=0.5; return 1; }
  else if(p.x < 1500){ gravity=0.2; return 2; }
  else if(p.x < 2200){ gravity=0.08; return 3; }
  else{ gravity=0.05; return 4; }
}

// ===== UPDATE =====
function update(){

  if(banned) return;

  console.log("BANNED:", banned);

  let s = stage();

  if(s !== lastStage){
  lastStage = s;
  luckCount++;
  triggerLuckEvent();
  }

  if(mode !== "main") return;

  // gerak
  let moveSpeed = 5;

if(buffs.speed) moveSpeed = 8;
if(debuffs.slow) moveSpeed = 2;

  if(debuffs.reverse){
  p.vx = -joystickX * moveSpeed; // kebalik
}else{
  p.vx = joystickX * moveSpeed;
  }
  
  let g = gravity;

if(buffs.lowGravity) g *= 0.5;
if(debuffs.heavy) g *= 2;

p.vy += g;
  p.x += p.vx;
  p.y += p.vy;

  // anti teleport (AMAN)
  if(Date.now() - safeTime > 1000){

  let speedX = Math.abs(p.vx);
  let distanceX = Math.abs(p.x - lastX);

  // 🚫 BAN hanya jika gerak horizontal terlalu cepat
  if(distanceX > 1000 && speedX > 8){
    triggerBan("berat");
  }

  }
  
  lastX = p.x;

  p.onGround = false;

  // ===== COLLISION PLATFORM =====
  for(let i of plat){
  if(
    p.x < i.x+i.w &&
    p.x+p.w > i.x &&
    p.y < i.y+i.h &&
    p.y+p.h > i.y
  ){
    if(p.vy > 0){
      p.y = i.y - p.h;
      p.vy = 0;
      p.onGround = true;
      coyoteTime = Date.now();
    }

    if(i.finish){

  winPoint++;

  if(winPoint >= 5){
    winPoint = 0;

    if(rankIndex < ranks.length - 1){
      rankIndex++;
      addChat("player","Naik Rank ke " + ranks[rankIndex].name + "!");
    } else {
      addChat("player","Rank MAX 🔥");
    }
  }

  saveRank();
  startEnding();
    }
  }
  }

  // ===== JUMP BUFFER =====
if(
  Date.now() - jumpBuffer < 150 &&
  (p.onGround || Date.now() - coyoteTime < 150)
){
  p.vy = -10;
  p.onGround = false;
  jumpBuffer = 0;
}

  // ===== SPAWN REGEN =====
  if(!regen.active && Math.random()<0.002){
    regen.active=true;
    regen.x=p.x+100+Math.random()*200;
    regen.y=200;
  }

  // ===== REGEN COLLISION =====
  if(regen.active){
    if(
      p.x < regen.x+regen.w &&
      p.x+p.w > regen.x &&
      p.y < regen.y+regen.h &&
      p.y+p.h > regen.y
    ){
      if(p.y + p.h <= regen.y + 10){
        p.y = regen.y - p.h;
        p.vy = 0;
        p.onGround = true;

        if(hp < maxHP && !healing){
          healing = true;
          healStart = Date.now();
        }
      }
    }
  }

  // ===== HEAL =====
  if(healing && Date.now()-healStart > 1000){
    if(Date.now()-lastRegenTime < 2000) regenCount++;
    else regenCount = 1;

    if(regenCount > 5) triggerBan("normal");

    lastRegenTime = Date.now();
    hp = maxHP;
    healing = false;
    regen.active = false;
  }
  
// HEAL MUSUH
  if(enemyHealing && Date.now()-enemyHealStart > 1000){
  enemy.hp = enemy.maxHP;
  enemyHealing = false;
  enemyRegen.active = false;

  addChat("enemy","Aku pulih kembali!");
  }

  // ===== ENEMY =====
  if(s==2){
    enemy.active=true;
  }

  // ===== HEAL MUSUH =====
if(enemyRegen.active){

  // musuh injak heal → sembuh
  if(
    enemy.x < enemyRegen.x+enemyRegen.w &&
    enemy.x+enemy.w > enemyRegen.x &&
    enemy.y < enemyRegen.y+enemyRegen.h &&
    enemy.y+enemy.h > enemyRegen.y
  ){
    if(enemy.y + enemy.h <= enemyRegen.y + 10){
      enemy.y = enemyRegen.y - enemy.h;
      enemy.vy = 0;
      enemy.onGround = true;

      if(!enemyHealing){
        enemyHealing = true;
        enemyHealStart = Date.now();
      }
    }
  }

  // player injak heal musuh → kena damage 2
  if(
    p.x < enemyRegen.x+enemyRegen.w &&
    p.x+p.w > enemyRegen.x &&
    p.y < enemyRegen.y+enemyRegen.h &&
    p.y+p.h > enemyRegen.y
  ){
    if(p.y + p.h <= enemyRegen.y + 10){

      hp -= 2; // 🔥 DAMAGE BESAR

      enemyRegen.active = false;

      addChat("enemy","Kau ceroboh! Itu milikku!");

      if(hp <= 0){
        alert("GAME OVER");
        location.reload();
      }
    }
  }
}

  // ===== ENEMY LOGIC =====
if(enemy.active){

  let difficulty = rankIndex;

enemy.maxHP = 3 + difficulty;
enemy.hp = Math.min(enemy.hp, enemy.maxHP);

let enemySpeed = 2 + difficulty * 0.5;
let predictPower = 5 + difficulty * 3;

let predictX = p.x + p.vx * predictPower;
let dx = predictX - enemy.x;

  // kalau ada heal → prioritas ke sana walaupun jauh
if(enemyRegen.active && enemy.hp < enemy.maxHP){
  enemy.ai = "heal";
}

  // lompat ke platform tinggi
if(enemy.onGround && Math.abs(p.y - enemy.y) > 40){
  enemy.vy = -10;
}

  // spawn heal musuh saat kena damage
if(enemy.hp < enemy.maxHP && !enemyRegen.active && Math.random()<0.01){
  enemyRegen.active = true;
  enemyRegen.x = enemy.x + (Math.random()*200 - 100);
  enemyRegen.y = enemy.y - 50;
}

  if(Math.abs(dx) < 40){
    enemy.x += dx>0 ? -1 : 1;
  }

  // MODE LENGAH
  if(Date.now() - enemy.lastSwitch > (enemy.state=="normal" ? 50000 : 20000)){
    enemy.state = enemy.state=="normal" ? "lemah" : "normal";
    enemy.lastSwitch = Date.now();
  }
}

  // ===== AI THINK =====
if(Date.now() - enemy.lastThink > 500){
  enemy.lastThink = Date.now();

  let dist = Math.abs(p.x - enemy.x);

  if(enemy.hp <= 1 && enemyRegen.active){
    enemy.ai = "heal";
  }
  else if(enemy.hp <= 1){
    enemy.ai = "retreat";
  }
  else if(dist < 60){
    enemy.ai = "attack";
  }
  else if(dist < 300){
    enemy.ai = "chase";
  }
  else{
    enemy.ai = "idle";
  }

  // 🔥 KHUSUS MODE HEAL
  if(enemy.ai == "heal"){
    let dxHeal = enemyRegen.x - enemy.x;

    if(Math.abs(dxHeal) > 5){
      enemy.x += dxHeal > 0 ? 2 : -2;
    }

    if(enemyRegen.y < enemy.y && enemy.onGround){
      enemy.vy = -10;
    }
  }
}
  else if(dist < 60){
    enemy.ai = "attack";
  }
  else if(dist < 300){
    enemy.ai = "chase";
  }
  else{
    enemy.ai = "idle";
  }
}

// ===== AI ACTION =====
if(enemy.ai == "idle"){
  // diem aja / patroli dikit
}

else if(enemy.ai == "chase"){
  if(Math.abs(dx)>5){
    enemy.x += dx>0 ? enemySpeed : -enemySpeed;
  }
}

else if(enemy.ai == "attack"){
  if(Math.abs(dx)>5){
    enemy.x += dx>0 ? enemySpeed : -enemySpeed;
  }

  if(enemy.onGround){
    enemy.vy = -10; // lompat serang
  }
}

else if(enemy.ai == "retreat"){
  // kabur dari player
  enemy.x += dx>0 ? -2 : 2;
}
  
// LOMPAT 
  if(Math.abs(dx) < 100 && enemy.onGround){
  enemy.vy = -8; // musuh bisa lompat
  }

  // GRAVITY MUSUH
  enemy.vy += 0.5;
  enemy.y += enemy.vy;

  // COLLISION MUSUH
  enemy.onGround = false;

for(let i of plat){
  if(
    enemy.x < i.x+i.w &&
    enemy.x+enemy.w > i.x &&
    enemy.y < i.y+i.h &&
    enemy.y+enemy.h > i.y
  ){
    if(enemy.vy>0){
      enemy.y = i.y - enemy.h;
      enemy.vy = 0;
      enemy.onGround = true; // 🔥 penting
    }
  }
}
}

  // ===== KENA MUSUH =====
  if(enemy.active){
  if(p.x < enemy.x+enemy.w && p.x+p.w > enemy.x &&
     p.y < enemy.y+enemy.h && p.y+p.h > enemy.y){

    if(Date.now() - safeTime > 500){

    // ✅ kalau lompat dari atas & musuh lagi lemah
    let injak =
  p.vy > 0 && // lagi turun
  p.y + p.h <= enemy.y + enemy.h/2 && // 🔥 lebih longgar (kunci fix)
  p.x + p.w > enemy.x + 5 &&
  p.x < enemy.x + enemy.w - 5;

if(injak && enemy.state == "lemah"){
  enemy.hp--; // ✅ BENAR
lastDamage = "enemy";
  p.vy = -8;

  addChat("player","Hancur sekarang!");
  addChat("enemy","Kau berani juga...");

  if(enemy.hp <= 0){
    enemy.active = false;
    spawnParticles(enemy.x, enemy.y);
    addChat("player","Selesai akhirnya.");
  }

} else {
  if(!buffs.shield){
    hp--;
    lastDamage = "enemy";

safeTime = Date.now();
    
  } else {
    addChat("player","Shield aktif! Aman 😎");
  }

if(hp <= 0){
  alert("GAME OVER");

  if(lastDamage == "enemyHeal"){
    hp = 2; // respawn sisa 2
  } else {
    hp = 3; // mati biasa full
  }

  lastDamage = ""; // reset biar gak kebawa

  reset();
  safeTime = Date.now();
}
  }
  }
  }
  }

  if(p.y > c.height) reset();

  for(let i of particles){
  i.x += i.vx;
  i.y += i.vy;
  i.vy += 0.2;
  i.life--;
}

particles = particles.filter(p=>p.life>0);

// ===== CLEAR BUFF =====
if(Date.now() > buffEnd){
  buffs = {shield:false, speed:false, lowGravity:false};
}

if(Date.now() > debuffEnd){
  debuffs = {slow:false, heavy:false, reverse:false};
}
  
}

// ===== RESET =====
function reset(){
  p.x=spawn.x;
  p.y=spawn.y;
  p.vy=0;
}

// ===== DRAW =====
function draw(){

  if(banned){
    ctx.fillStyle="black";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle="red";
    ctx.font="bold 40px Arial";
    ctx.textAlign="center";
    ctx.fillText("BANNED", c.width/2,150);

    let sisa = banEndTime - Date.now();
    let jam = Math.floor(sisa/3600000);
    let menit = Math.floor((sisa%3600000)/60000);
    let detik = Math.floor((sisa%60000)/1000);

    ctx.fillStyle="white";
    ctx.fillText(jam+":"+menit+":"+detik, c.width/2,250);
    return;
  }

  let s = stage();
  if(!s) return;

  // background
  if(s==1) ctx.fillStyle="skyblue";
  else if(s==2) ctx.fillStyle="#400000";
  else if(s==3) ctx.fillStyle="black";
  else{
    let g = ctx.createLinearGradient(0,0,c.width,c.height);
    g.addColorStop(0,"black");
    g.addColorStop(0.5,"pink");
    g.addColorStop(1,"white");
    ctx.fillStyle=g;
  }

  ctx.fillRect(0,0,c.width,c.height);

 ctx.save();

// smooth follow
camX += (p.x - camX - 100) * 0.3;

// 🚫 anti ketinggalan
if(Math.abs(p.x - camX) > 500){
  camX = p.x - 100;
}

ctx.translate(-camX,0);

  // platform
  for(let i of plat){
    ctx.fillStyle = i.finish?"yellow":i.w==10?"lime":"green";
    ctx.fillRect(i.x,i.y,i.w,i.h);
  }

  // regen
  if(regen.active){
    ctx.fillStyle="#00FFFF";
    ctx.fillRect(regen.x,regen.y,regen.w,regen.h);
  }

  // heal musuh (warna oren)
if(enemyRegen.active){
  ctx.fillStyle = "orange";
  ctx.fillRect(enemyRegen.x, enemyRegen.y, enemyRegen.w, enemyRegen.h);
}

  // enemy
if(enemy.active){
  ctx.fillStyle = enemy.state=="lemah" ? "black" : "red";
  ctx.fillRect(enemy.x,enemy.y,enemy.w,enemy.h);
}

  // player
  ctx.fillStyle="white";
  ctx.fillRect(p.x,p.y,p.w,p.h);

  for(let i of particles){
  ctx.fillStyle = `hsl(${Math.random()*360},100%,50%)`;
  ctx.fillRect(i.x,i.y,5,5);
  }

  if(showTamat){
  ctx.fillStyle = "white";
  ctx.font = "bold 50px Arial";
  ctx.textAlign = "center";
  ctx.fillText("TAMAT", c.width/2, c.height/2);
  }

  ctx.restore();

  // HP UI
  for(let i=0;i<maxHP;i++){
    ctx.strokeStyle="white";
    ctx.strokeRect(c.width-50-(i*35),20,25,25);
    ctx.fillStyle = i<hp?"blue":"black";
    ctx.fillRect(c.width-50-(i*35),20,25,25);
  }

let yPos = c.height - 80;

for(let i=chats.length-1;i>=0;i--){
  let chat = chats[i];

  if(Date.now() - chat.time > 4000) continue;

  ctx.fillStyle = chat.sender=="player" ? "cyan" : "red";
  ctx.font = "14px Arial";

  ctx.fillText(
    (chat.sender=="player"?"Player: ":"Musuh: ") + chat.text,
    50,
    yPos
  );

  yPos -= 20;
}

  // ===== RANK UI =====
ctx.fillStyle = "white";
ctx.font = "16px Arial";

let r = ranks[rankIndex];

ctx.fillText(
  r.icon + " " + r.name + " (" + winPoint + "/5)",
  20,
  30
);
  
}

// ===== LOOP =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
